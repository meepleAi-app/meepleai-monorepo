name: RAG Smoke (canonical queries vs golden baseline)

# Tier 3 D8 of #2126 / #2480 — retrieval-quality smoke.
#
# Consumes a published seed snapshot (`make dev-from-snapshot`), runs the canonical
# RAG queries in infra/fixtures/rag-canonical-queries.json, and asserts the top-3
# retrieved chunks match infra/fixtures/rag-golden-baseline.json. Catches silent
# retrieval regressions (embedding model / chunker / index drift) that the bake
# smoke does not cover.
#
# ⚠️ DISPATCH-ONLY (no cron) until the golden baseline is committed:
#   R2 snapshot distribution now WORKS (#2516): the dedicated meepleai-seed-snapshots
#   bucket + SEED_BLOB_* repo secrets are configured, and dev-from-snapshot fetches
#   the published snapshot via the read creds synthesized in "Configure snapshot
#   bucket read credentials" below. The only remaining step before the weekly
#   schedule is committing the golden baseline for the published snapshot: dispatch
#   with update_baseline=true, download the artifact, and commit
#   infra/fixtures/rag-golden-baseline.json. Flip to `schedule:` in that same PR.

on:
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'Capture/overwrite the golden baseline from this run (instead of asserting)'
        required: false
        default: 'false'
        type: boolean

# ADR-078: monitor/consume workflows serialize per ref to stay under the API/runner budget.
concurrency:
  group: rag-smoke-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  rag-smoke:
    name: RAG canonical queries vs golden baseline
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      # .secret / env files are gitignored — generate placeholders so docker compose boots.
      - name: Generate placeholder secrets
        working-directory: infra
        run: make secrets-setup

      - name: Generate placeholder api.env.dev
        working-directory: infra/env
        run: |
          cat > api.env.dev <<'APIENV'
          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          REDIS_HOST=redis
          REDIS_PORT=6379
          EMBEDDING_SERVICE_URL=http://embedding-service:8000
          UNSTRUCTURED_SERVICE_URL=http://unstructured-service:8001
          SMOLDOCLING_SERVICE_URL=http://smoldocling-service:8002
          RERANKER_SERVICE_URL=http://reranker-service:8003
          OLLAMA_URL=http://ollama:11434
          N8N_URL=http://n8n:5678
          STORAGE_PROVIDER=local
          APIENV

      - name: Configure snapshot bucket read credentials
        working-directory: infra
        env:
          SEED_BLOB_S3_ENDPOINT: ${{ secrets.SEED_BLOB_S3_ENDPOINT }}
          SEED_BLOB_S3_ACCESS_KEY: ${{ secrets.SEED_BLOB_S3_ACCESS_KEY }}
          SEED_BLOB_S3_SECRET_KEY: ${{ secrets.SEED_BLOB_S3_SECRET_KEY }}
          SEED_BLOB_BUCKET: ${{ secrets.SEED_BLOB_BUCKET }}
        run: |
          # snapshot-fetch.sh reads the snapshot bucket via S3_ENDPOINT/S3_ACCESS_KEY/
          # S3_SECRET_KEY + SEED_BLOB_BUCKET from storage.secret. Map the dedicated
          # SEED_BLOB_* repo secrets onto those keys (overwriting the make secrets-setup
          # placeholder). STORAGE_PROVIDER=local so the app uses disk — RAG retrieval
          # reads the restored DB index, not blob storage. #2480.
          : "${SEED_BLOB_S3_ENDPOINT:?SEED_BLOB_S3_ENDPOINT secret not configured}"
          cat > secrets/storage.secret <<EOF
          STORAGE_PROVIDER=local
          S3_ENDPOINT=${SEED_BLOB_S3_ENDPOINT}
          S3_ACCESS_KEY=${SEED_BLOB_S3_ACCESS_KEY}
          S3_SECRET_KEY=${SEED_BLOB_S3_SECRET_KEY}
          S3_REGION=auto
          SEED_BLOB_BUCKET=${SEED_BLOB_BUCKET}
          EOF
          chmod 600 secrets/storage.secret

      # snapshot-restore.sh applies the working-tree schema via `dotnet ef database
      # update` on the host before pg_restore --data-only, so the consume flow needs
      # the .NET SDK + dotnet-ef tool present (#2480).
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Install dotnet-ef tool
        run: |
          if dotnet tool list --global | awk '{print $1}' | grep -qx 'dotnet-ef'; then
            echo "dotnet-ef already installed globally:"; dotnet tool list --global | grep '^dotnet-ef'
          else
            dotnet tool install --global dotnet-ef --version 9.*
          fi
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Boot from published snapshot
        working-directory: infra
        env:
          # Canonical out-dir (repo root, gitignored) so fetch/verify/restore use
          # the same dir as the bake workflows — NOT infra/data/snapshots, which a
          # relative default would create and where a stale snapshot used to be
          # committed (#2480).
          SEED_INDEX_OUT_DIR: ${{ github.workspace }}/data/snapshots
        run: |
          # Inline the dev-from-snapshot flow but bring up ONLY the services RAG
          # retrieval needs — `make dev-from-snapshot` does `--profile ai up -d`
          # which also starts web + n8n (extra env_files + a Next.js build) that
          # this smoke doesn't use and that only add failure surface + minutes on
          # a 2-core runner (#2480). COMPOSE mirrors the Makefile.
          COMPOSE="docker compose -f docker-compose.yml -f compose.dev.yml"
          bash scripts/snapshot-fetch.sh
          bash scripts/snapshot-verify.sh
          $COMPOSE up -d postgres
          bash scripts/wait-for-healthy.sh postgres 60
          bash scripts/snapshot-restore.sh
          SKIP_CATALOG_SEED=true $COMPOSE --profile ai up -d postgres redis api embedding-service reranker-service
          bash scripts/wait-for-healthy.sh api 300

      - name: Run RAG smoke
        id: ragsmoke
        working-directory: infra
        env:
          API_BASE_URL: http://localhost:8080
          SEED_INDEX_OUT_DIR: ${{ github.workspace }}/data/snapshots
          # The published snapshot is baked with the INITIAL_ADMIN user (same creds
          # as the bake workflows). Auth as that user — SMOKE_USER_* secrets don't
          # exist and wouldn't be present in the snapshot DB anyway. #2480.
          SMOKE_EMAIL: bake-admin@meepleai.test
          SMOKE_PASSWORD: BakeSeed1!Admin
        run: |
          if [ "${{ github.event.inputs.update_baseline }}" = "true" ]; then
            bash scripts/rag-smoke-assert.sh --update-baseline
            echo "::notice:: baseline updated — download the diff from the job and commit infra/fixtures/rag-golden-baseline.json"
          else
            bash scripts/rag-smoke-assert.sh
          fi

      - name: Upload updated baseline (when --update-baseline)
        if: ${{ github.event.inputs.update_baseline == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: rag-golden-baseline-${{ github.run_id }}
          path: infra/fixtures/rag-golden-baseline.json
          retention-days: 14

      - name: Open issue on retrieval drift
        # Only on actual retrieval drift (the smoke step failed), NOT on an infra
        # failure like the broken R2 snapshot fetch in "Boot from published snapshot".
        if: ${{ steps.ragsmoke.outcome == 'failure' && github.event.inputs.update_baseline != 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'rag-smoke-failure', state: 'open'
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `[RAG SMOKE] retrieval drift — ${new Date().toISOString().slice(0,10)}`,
                labels: ['bug', 'rag-smoke-failure'],
                body: `Canonical RAG queries drifted from the golden baseline. See run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.\n\nIf the drift is intentional (re-index), regenerate via \`--update-baseline\` per docs/for-developers/operations/rag-smoke-runbook.md.`
              });
            }
