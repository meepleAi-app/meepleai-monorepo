# Dev Async — non-blocking heavy checks on push to main-dev
#
# Per ADR-054 and epic #842 / issue #846: heavier integration + E2E suites
# run AFTER the merge to main-dev, not on the PR. Target SLO < 15 min.
# Failures here trigger the auto-revert bot (#843) once that lands; in the
# meantime, repeated red runs surface in the nightly digest (#850).
#
# This workflow does NOT gate PR merges. The hot path is dev-fast.yml.
name: Dev Async

on:
  push:
    branches: [main-dev]
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'apps/orchestration-service/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'global.json'
      - '.github/workflows/dev-async.yml'
      - '.github/actions/**'
  workflow_dispatch:

concurrency:
  group: dev-async-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      orchestration: ${{ steps.filter.outputs.orchestration }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Issue #850: filter patterns must cover ALL paths that trigger
          # this workflow (see dev-fast.yml for rationale).
          filters: |
            frontend:
              - 'apps/web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/dev-async.yml'
              - '.github/actions/setup-frontend/**'
              - '.github/actions/setup-playwright/**'
            backend:
              - 'apps/api/**'
              - 'global.json'
              - '.github/workflows/dev-async.yml'
              - '.github/actions/setup-backend/**'
            orchestration:
              - 'apps/orchestration-service/**'

  backend-integration:
    name: Backend Integration (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-backend
        with:
          dotnet-version: '9.0.x'
          working-directory: apps/api
          cache-version: ${{ vars.CACHE_VERSION || 'v1' }}

      - name: Build (Release)
        working-directory: apps/api
        run: dotnet build --no-restore --configuration Release

      - name: Integration tests
        working-directory: apps/api/tests/Api.Tests
        run: dotnet test --no-build --configuration Release --filter "Category=Integration" --verbosity quiet
