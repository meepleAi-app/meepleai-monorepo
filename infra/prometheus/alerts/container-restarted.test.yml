# promtool test — #3822: gli alert container_* devono distinguere un container da un cgroup.
#
# Il difetto che questo test previene e' doppio, e le due meta' sono opposte:
#   - FALSI POSITIVI: cAdvisor espone `container_start_time_seconds` per ogni cgroup, comprese le
#     slice di systemd. `/user.slice/user-1000.slice` viene ricreata a OGNI LOGIN SSH, quindi
#     senza il filtro `name!=""` l'alert scattava ogni volta che qualcuno si collegava al VPS.
#   - FALSI NEGATIVI: la stessa mancanza di `name` rendeva l'annotazione
#     "Container {{ $labels.name }} has restarted" priva di nome, e un riavvio vero si perdeva
#     fra le righe di rumore.
#
# Il filtro copre entrambe le meta', ma vale solo se cAdvisor popola `name` — cosa che la
# v0.49.1 su questo host non faceva affatto (0 container riconosciuti su 43 serie). Quella meta'
# non e' verificabile qui: la copre la verifica sul campo con `count by (name)`.

rule_files:
  - ../../prometheus-rules.yml

evaluation_interval: 1m

tests:
  # ── Un cgroup di systemd non e' un container ──────────────────────────────────────────────
  - interval: 1m
    name: "un cgroup senza name NON fa scattare l'alert"
    input_series:
      # forma reale osservata su staging: la user slice ricreata da un login SSH, che fa saltare
      # container_start_time_seconds a un valore nuovo
      - series: 'container_start_time_seconds{id="/user.slice/user-1000.slice",name=""}'
        values: '1000+0x5 2000+0x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: ContainerRestarted
        exp_alerts: []

  # ── Un container vero invece deve farlo scattare ──────────────────────────────────────────
  - interval: 1m
    name: "un container con name fa scattare l'alert e l'annotazione lo nomina"
    input_series:
      - series: 'container_start_time_seconds{id="/system.slice/docker-abc.scope",name="meepleai-api"}'
        values: '1000+0x5 2000+0x60'
    alert_rule_test:
      # Il riavvio e' a t=6m, e la finestra di `increase(...[5m])` e' SEMIAPERTA: appena il
      # campione pre-salto ne esce, l'espressione torna a 0. Misurato: 1250 a t=7m, gia' 0 a
      # t=10m. Con `for: 1m` la finestra utile e' [7m, 10m) — valuto a 9m, non a 10m come
      # avevo scritto la prima volta, dove il test falliva pur essendo corretta la regola.
      - eval_time: 9m
        alertname: ContainerRestarted
        exp_alerts:
          - exp_labels:
              severity: warning
              service: infrastructure
              category: container
              id: "/system.slice/docker-abc.scope"
              name: "meepleai-api"
            exp_annotations:
              summary: "Container meepleai-api has restarted"
              description: |
                Container meepleai-api has been restarted.
                Check container logs for crash reasons or OOM kills.
              runbook_url: "https://docs.meepleai.dev/runbooks/infrastructure-monitoring"

  # ── Controprova: nessun riavvio, nessun alert ─────────────────────────────────────────────
  #
  # Senza questo caso il test sopra passerebbe anche se l'espressione fosse sempre vera.
  - interval: 1m
    name: "un container che non riparte non fa scattare nulla"
    input_series:
      - series: 'container_start_time_seconds{id="/system.slice/docker-abc.scope",name="meepleai-api"}'
        values: '1000+0x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: ContainerRestarted
        exp_alerts: []

  # ── #3822 follow-up: ContainerHighCPU non deve scattare sull'host ─────────────────────────
  #
  # Osservato su staging appena cAdvisor ha ripreso a esporre metriche: tre istanze firing su
  # `/`, `/system.slice` e `/system.slice/docker.service`. "CPU > 80% di un core" su un cgroup
  # che aggrega l'intero host non e' la stessa affermazione che sul singolo container.
  - interval: 1m
    name: "ContainerHighCPU ignora i cgroup di sistema"
    input_series:
      - series: 'container_cpu_usage_seconds_total{id="/system.slice",name=""}'
        values: '0+60x20'   # 1 core pieno: sarebbe ben sopra 0.8
    alert_rule_test:
      - eval_time: 10m
        alertname: ContainerHighCPU
        exp_alerts: []

  - interval: 1m
    name: "ContainerHighCPU scatta su un container vero"
    input_series:
      - series: 'container_cpu_usage_seconds_total{id="/system.slice/docker-abc.scope",name="meepleai-api"}'
        values: '0+60x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: ContainerHighCPU
        exp_alerts:
          - exp_labels:
              severity: warning
              service: infrastructure
              category: container
              id: "/system.slice/docker-abc.scope"
              name: "meepleai-api"
            exp_annotations:
              summary: "Container meepleai-api CPU usage > 80%"
              description: |
                Container meepleai-api CPU usage is 100%.
                High CPU usage may affect performance.
                Check for CPU-intensive operations or consider resource optimization.
              runbook_url: "https://docs.meepleai.dev/runbooks/infrastructure-monitoring"
              dashboard_url: "http://localhost:3001/d/infrastructure-monitoring"

  # ── #3822 follow-up: ContainerHighMemory guarda il working set, non la cache ──────────────
  #
  # `container_memory_usage_bytes` include la page cache, che il kernel rilascia sotto pressione
  # e che quindi non avvicina un OOM kill. Qui il container ha 950 MB di usage su 1 GB di limite
  # (95%), ma solo 500 MB di working set (50%): con la metrica sbagliata l'alert scatterebbe.
  - interval: 1m
    name: "ContainerHighMemory non scatta se l'occupazione e' page cache"
    input_series:
      - series: 'container_memory_usage_bytes{id="/system.slice/docker-abc.scope",name="meepleai-api"}'
        values: '950000000+0x20'
      - series: 'container_memory_working_set_bytes{id="/system.slice/docker-abc.scope",name="meepleai-api"}'
        values: '500000000+0x20'
      - series: 'container_spec_memory_limit_bytes{id="/system.slice/docker-abc.scope",name="meepleai-api"}'
        values: '1000000000+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: ContainerHighMemory
        exp_alerts: []

  - interval: 1m
    name: "ContainerHighMemory scatta quando e' il working set a essere alto"
    input_series:
      - series: 'container_memory_working_set_bytes{id="/system.slice/docker-abc.scope",name="meepleai-api"}'
        values: '950000000+0x20'
      - series: 'container_spec_memory_limit_bytes{id="/system.slice/docker-abc.scope",name="meepleai-api"}'
        values: '1000000000+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: ContainerHighMemory
        exp_alerts:
          - exp_labels:
              severity: warning
              service: infrastructure
              category: container
              id: "/system.slice/docker-abc.scope"
              name: "meepleai-api"
            exp_annotations:
              summary: "Container meepleai-api memory usage > 90%"
              description: |
                Container meepleai-api is using 95% of its memory limit.
                Current usage may lead to OOM kills.
                Check container logs and consider increasing memory limits.
              runbook_url: "https://docs.meepleai.dev/runbooks/infrastructure-monitoring"
              dashboard_url: "http://localhost:3001/d/infrastructure-monitoring"
