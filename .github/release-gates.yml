# Release-gate Classification — main-dev → main-staging PRs
#
# Authoritative mapping of CI check names to severity + owner + override-path.
# Bot script: scripts/release-gate/comment.mjs (auto-classifies failures on release PRs)
# Validator:  scripts/release-gate/validate.mjs (`cd scripts/release-gate && pnpm install --frozen-lockfile && pnpm validate`)
#
# Schema version: 1
# Issue: https://github.com/meepleAi-app/meepleai-monorepo/issues/1016
# Design doc: docs/for-developers/specs/2026-05-22-release-gate-spreadsheet.md
#
# ─── Schema evolution policy (AC-9) ───────────────────────────────────────────
# - When a workflow is renamed:
#     1. Keep the old `check_name` entry in this file for at least 2 release cycles
#        as a grace period (covers in-flight PRs whose check_runs reference the old name).
#     2. Add the new `check_name` entry alongside; both classify identically.
#     3. Remove the old entry after the grace period expires.
# - Fallback regex (handled by bot script): if `check_name` is not found in the
#   `checks:` list, the bot performs a prefix-match against `fallback_patterns:`
#   below (e.g. `dev-async/*` matches `dev-async/test-1`, `dev-async/test-2`).
# - Unknown checks (no exact match, no pattern match) default to severity=warning,
#   owner=unknown, override_path=exception-comment + footer
#   "🆕 N new checks detected — please update .github/release-gates.yml".
#
# ─── Severity rubric ──────────────────────────────────────────────────────────
# - blocker:       Must be fixed before merge. Real regression or new CVE.
# - warning:       Known pre-existing debt or flake. Manual triage acceptable.
# - informational: Non-blocking signal. Auto-pass.
#
# ─── Owner rubric ─────────────────────────────────────────────────────────────
# - backend-dev:   apps/api, EF Core migrations, .NET tests, CodeQL csharp
# - frontend-dev:  apps/web, Vitest, Playwright, Lighthouse
# - qa:            A11y, visual regression, manual QA gates
# - devops:        GitHub Actions infra, branch protection, secrets, runners,
#                  source-branch validation, link checks, dependency audits
# - unknown:       Fallback when no rule matches (bot footer requests update)
#
# ─── Override path rubric ─────────────────────────────────────────────────────
# - fix-forward:        Fix the issue in this PR or a follow-up before merge.
# - revert:             Revert the offending commit (last resort, security only).
# - exception-comment:  PR description comments justifying the bypass.
# - baseline-update:    Update the test baseline / snapshot / accepted violations.

version: 1

# Last refreshed: 2026-11-09 (#4937: check-runs on the heads of release PRs #4892 and #4897,
#   `gh api repos/meepleAi-app/meepleai-monorepo/commits/<sha>/check-runs`)
# Refresh policy: when the bot comment reports "🆕 N new checks". Since #4937 the bot re-runs when CI
#   finishes on a release head (workflow_run), so the footer reflects the checks that actually ran.
#   The old "every 5 release PRs" rule was never applied: nothing measured it.

checks:
  # ─── Backend (apps/api) ─────────────────────────────────────────────────────
  - check_name: "Backend - Unit Tests"
    severity: blocker
    owner: backend-dev
    override_path: fix-forward
    pre_existing_in_main_dev: false
    notes: "xUnit unit suite. Failure indicates code regression."

  - check_name: "Backend - Integration (Core)"
    severity: blocker
    owner: backend-dev
    override_path: fix-forward
    pre_existing_in_main_dev: false
    notes: "Testcontainers + EF Core. Red on the heads of #4892 and #4897: before calling it a regression, compare the failing test NAMES with a control run on main-dev (Dev Async baseline, see #4961)."

  - check_name: "Backend - Integration (CoreEndpoints)"
    severity: blocker
    owner: backend-dev
    override_path: fix-forward
    pre_existing_in_main_dev: false
    notes: "Staccato da Core con #4880: Integration.Routing, Integration.Testing, Integration.Events."

  - check_name: "Backend - Integration (Games)"
    severity: warning
    owner: backend-dev
    override_path: exception-comment
    pre_existing_in_main_dev: true
    notes: "Check rimosso da #4329: ci.yml ha diviso lo shard in Catalog e GamesAdmin, come dev-async.yml. La voce resta per due cicli di rilascio (policy AC-9, in testa al file) e poi si toglie. Su una PR aperta prima del merge di #4329 il job puo' ancora fermarsi al limite di 75 minuti (Aborted, zero falliti): leggi il log per 'test run timeout' prima di trattarlo come un fallimento."

  - check_name: "Backend - Integration (KnowledgeBase)"
    severity: blocker
    owner: backend-dev
    override_path: fix-forward
    pre_existing_in_main_dev: false
    notes: "KB + RAG integration, pgvector. Da #4329 lo shard non contiene piu' DocumentProcessing ne' Integration.Authentication, che hanno shard propri: i falliti di base dei giri di rilascio (#4996) ora sono in DocProcessing. Prima di chiamare regressione un rosso, confronta i NOMI dei falliti con un run di controllo su main-dev."

  - check_name: "Backend - Integration (DocProcessing)"
    severity: blocker
    owner: backend-dev
    override_path: fix-forward
    pre_existing_in_main_dev: true
    notes: "Shard nuovo con #4329 (DocumentProcessing, staccato da KnowledgeBase). Porta i falliti di base tracciati in #4996: confronta i NOMI dei falliti col controllo Dev Async su main-dev prima di chiamarla regressione."

  - check_name: "Backend - Integration (AuthIntegration)"
    severity: warning
    owner: backend-dev
    override_path: exception-comment
    pre_existing_in_main_dev: false
    notes: "Shard nuovo con #4329 (Integration.Authentication, staccato da KnowledgeBase). Parte warning perche' una voce mai vista verde parte warning (regola T3, commento di decisione di #4329); diventa blocker dopo due giri di rilascio verdi (#4329)."

  - check_name: "Backend - Integration (Catalog)"
    severity: warning
    owner: backend-dev
    override_path: exception-comment
    pre_existing_in_main_dev: false
    notes: "Shard nuovo con #4329 (SharedGameCatalog, staccato da Games). Parte warning perche' una voce mai vista verde parte warning (regola T3, commento di decisione di #4329); diventa blocker dopo due giri di rilascio verdi (#4329)."

  - check_name: "Backend - Integration (GamesAdmin)"
    severity: warning
    owner: backend-dev
    override_path: exception-comment
    pre_existing_in_main_dev: false
    notes: "Shard nuovo con #4329 (GameManagement e Administration, staccato da Games). Parte warning perche' una voce mai vista verde parte warning (regola T3, commento di decisione di #4329); diventa blocker dopo due giri di rilascio verdi (#4329)."

  - check_name: "Backend Integration (Testcontainers)"
    severity: blocker
    owner: backend-dev
    override_path: fix-forward
    pre_existing_in_main_dev: false
    notes: "Aggregate Testcontainers gate. Often CANCELLED upstream of Core/Games/KB failures."

  - check_name: "Backend Fast"
    severity: warning
    owner: backend-dev
    override_path: exception-comment
    pre_existing_in_main_dev: true
    notes: "Non-required. Known red tests are listed by name in CLAUDE.md § Known Flaky Tests (baseline): compare names, not counts."

  # ─── Frontend (apps/web) ────────────────────────────────────────────────────
  # 'Frontend - Build & Test' (split by #1530 on 2026-05-25) removed by #4937: its grace period ended in 2026-07.
  - check_name: "Frontend - Lint"
    severity: blocker
    owner: frontend-dev
    override_path: fix-forward
    pre_existing_in_main_dev: false
    notes: "ESLint (--max-warnings=15) + token-vocabulary inventory. Split from 'Frontend - Build & Test' (#1530)."

  - check_name: "Frontend - Typecheck"
    severity: blocker
    owner: frontend-dev
    override_path: fix-forward
    pre_existing_in_main_dev: false
    notes: "tsc --noEmit. Split from 'Frontend - Build & Test' (#1530)."

  - check_name: "Frontend - Unit Tests (shard 1/3)"
    severity: blocker
    owner: frontend-dev
    override_path: fix-forward
    pre_existing_in_main_dev: false
    notes: "Vitest shard 1/3. Split from 'Frontend - Build & Test' (#1530). Also covered by ^Frontend -  fallback."

  - check_name: "Frontend - Unit Tests (shard 2/3)"
    severity: blocker
    owner: frontend-dev
    override_path: fix-forward
    pre_existing_in_main_dev: false
    notes: "Vitest shard 2/3. Split from 'Frontend - Build & Test' (#1530)."

  - check_name: "Frontend - Unit Tests (shard 3/3)"
    severity: blocker
    owner: frontend-dev
    override_path: fix-forward
    pre_existing_in_main_dev: false
    notes: "Vitest shard 3/3. Split from 'Frontend - Build & Test' (#1530)."

  - check_name: "Frontend - A11y E2E"
    severity: warning
    owner: qa
    override_path: baseline-update
    pre_existing_in_main_dev: true
    notes: "Known violations tracked in #1094 (Phase A→D plan); the current list is the accepted baseline, not a count. Advisory until Phase D ships."

  - check_name: "A11y unit smoke (Vitest accessibility specs)"
    severity: warning
    owner: qa
    override_path: baseline-update
    pre_existing_in_main_dev: true
    notes: "Companion to Frontend - A11y E2E. Same baseline #1094."

  - check_name: "Lighthouse CI"
    severity: warning
    owner: frontend-dev
    override_path: exception-comment
    pre_existing_in_main_dev: true
    notes: "Performance budget. Flake-prone on busy runners; retry before reverting."

  - check_name: "K6 Performance Tests"
    severity: warning
    owner: backend-dev
    override_path: exception-comment
    pre_existing_in_main_dev: false
    notes: "Smoke run of the API (test-performance.yml), a correctness check since #4978: red means the preflight login, or auth_errors/checks of a k6 scenario (a defect of the API or of the scenario), or a step before k6 (install, build, API start): read the failing step. Latency is informative only. Until #4978 it was red on every round for its own causes (k6 GPG key, no load-test user, 30-minute timeout). The same job runs nightly on main-dev: compare with that run's job, not with the run's conclusion. Promote to blocker after two consecutive green release rounds (#4978)."

  # ─── Security ───────────────────────────────────────────────────────────────
  - check_name: "CodeQL"
    severity: blocker
    owner: backend-dev
    override_path: fix-forward
    pre_existing_in_main_dev: false
    notes: "Static security analysis (csharp + javascript). New finding requires triage."

  - check_name: "GitGuardian Security Checks"
    severity: blocker
    owner: devops
    override_path: revert
    pre_existing_in_main_dev: false
    notes: "Required check on main-dev. Secret-leak detection. Revert + rotate immediately."

  # ─── DevOps / Infrastructure ────────────────────────────────────────────────
  - check_name: "validate-source-branch"
    severity: warning
    owner: devops
    override_path: exception-comment
    pre_existing_in_main_dev: true
    notes: "Branch Policy (auto-branch-policy.yml) accepts only main-dev → main-staging and main-staging → main, but release PRs use a release/<date>-*-promote head, so it is red by construction on every release PR (#4892, #4897). Check by hand that the head is the branch it promotes: `git merge-base --is-ancestor <head> origin/main-dev` (or origin/main-staging for the prod hop)."

  - check_name: "State Matrix Sync + Enforcement"
    severity: warning
    owner: devops
    override_path: fix-forward
    pre_existing_in_main_dev: false
    notes: "Implemented #2998 via .github/workflows/state-matrix-sync.yml (scripts/v2_audit --check). Non-blocking: v2-migration-matrix.md row drift is reported as ::warning:: annotations (exit 0), so drift alone never reds this check — a red status means the v2_audit self-tests regressed. Reconcile drift fix-forward. Matrix sync is now automated (was manual)."

  - check_name: "codecov/patch"
    severity: warning
    owner: devops
    override_path: baseline-update
    pre_existing_in_main_dev: true
    notes: "Patch coverage threshold. Tolerated drops require updated baseline."

  - check_name: "CI Success"
    severity: warning
    owner: devops
    override_path: exception-comment
    pre_existing_in_main_dev: false
    notes: "Aggregate of upstream jobs. Failure mirrors one of the per-job failures above."

  # ─── External / advisory ────────────────────────────────────────────────────
  - check_name: "Lychee Link Check"
    severity: informational
    owner: devops
    override_path: exception-comment
    pre_existing_in_main_dev: true
    notes: "External link rot. Non-blocking unless docs-critical (see #1014)."

  # 'Conformity gate' (workflow removed 2026-05-20, #1066/#1069) removed by #4937: its grace period ended 2026-06-30.

  - check_name: "smoke (ubuntu-latest)"
    severity: warning
    owner: backend-dev
    override_path: exception-comment
    pre_existing_in_main_dev: false
    notes: "API Smoke (Bruno), api-smoke.yml, on PRs to main only (#943; job renamed from 'api-smoke'). Red on the head of #4897 without a triage: read the job log before the next prod promotion."

  - check_name: "smoke (windows-latest)"
    severity: warning
    owner: backend-dev
    override_path: exception-comment
    pre_existing_in_main_dev: false
    notes: "Windows leg of 'smoke (ubuntu-latest)'; same workflow, same note."

  # ─── End-to-end suites (separate workflows, run on release PRs only) ────────
  - check_name: "Backend E2E Tests"
    severity: warning
    owner: backend-dev
    override_path: exception-comment
    pre_existing_in_main_dev: true
    notes: "backend-e2e-tests.yml runs on PRs to main / main-staging, never on PRs to main-dev (#4032), and carries pre-existing failures. Compare the failing test NAMES with a control run: `gh workflow run backend-e2e-tests.yml --ref main-dev`, then `comm` on the two name sets. Only names missing from the control run are the release's."

  - check_name: "Backend E2E Test Results"
    severity: warning
    owner: backend-dev
    override_path: exception-comment
    pre_existing_in_main_dev: true
    notes: "Report job of 'Backend E2E Tests'; same comparison by name."

  - check_name: "Backend E2E Quality Gate"
    severity: warning
    owner: backend-dev
    override_path: exception-comment
    pre_existing_in_main_dev: true
    notes: "Aggregate of 'Backend E2E Tests'; red whenever it is."

  - check_name: "E2E Quality Gate"
    severity: warning
    owner: frontend-dev
    override_path: exception-comment
    pre_existing_in_main_dev: false
    notes: "Aggregate of the Playwright shards of test-e2e.yml ('E2E Tests (Shard N)'); red whenever a shard is not green. Since #4123 its log names why for each shard (FALLITO, TIMEOUT, annullato a mano, sostituito): a TIMEOUT is the 6-hour cap, not a failing test. It does not run on a run cancelled by hand or by concurrency."

  - check_name: "cover-r2-strict"
    severity: warning
    owner: frontend-dev
    override_path: exception-comment
    pre_existing_in_main_dev: false
    notes: "e2e-cover-r2-strict.yml: the cover chain (presign, CSP, load in the browser) on a Docker stack with storage. Runs on every PR that touches its paths, PRs to main-dev included. A red outside the cover chain, in the Docker build (next/font/google in the web build, apt in the API image), does not depend on the diff: #4997. Rerun on the same SHA before triaging (green on #4972, red on #4977 on the font build, green again at the rerun)."

# ─── Fallback regex patterns (AC-9) ──────────────────────────────────────────
# Applied when `check_name` is not found in the `checks:` list above.
# First match wins. If no pattern matches, default classification kicks in
# (severity=warning, owner=unknown, override_path=exception-comment).

fallback_patterns:
  - pattern: "^Backend - "
    severity: blocker
    owner: backend-dev
    override_path: fix-forward
    notes: "Catch-all for new Backend integration suites."

  - pattern: "^Backend "
    severity: warning
    owner: backend-dev
    override_path: exception-comment
    notes: "Catch-all for non-Integration backend jobs."

  - pattern: "^Frontend - "
    severity: blocker
    owner: frontend-dev
    override_path: fix-forward
    notes: "Catch-all for new Frontend gates."

  - pattern: "^Frontend "
    severity: warning
    owner: frontend-dev
    override_path: exception-comment
    notes: "Catch-all for non-gate frontend jobs."

  - pattern: "^E2E Tests \\(Shard [0-9]+\\)$"
    severity: warning
    owner: frontend-dev
    override_path: exception-comment
    notes: "Playwright shard of test-e2e.yml, on PRs to main. The matrix is fail-fast: false, so a cancelled shard did not stop because another one failed (shards 2-6 were cancelled on the head of #4897): read the run to see why before reading it as pass or fail. Compare failing spec names with a run on main-dev before calling it a regression."

  - pattern: "^A11y"
    severity: warning
    owner: qa
    override_path: baseline-update
    notes: "Catch-all for accessibility gates."

  - pattern: "(?i)security|codeql|gitguardian|dependabot"
    severity: blocker
    owner: devops
    override_path: revert
    notes: "Catch-all for security tooling. Default to revert/triage."

  - pattern: "(?i)lychee|linkcheck|link-check"
    severity: informational
    owner: devops
    override_path: exception-comment
    notes: "Catch-all for external link validators."

# ─── Bot configuration ───────────────────────────────────────────────────────
# Read by scripts/release-gate/comment.mjs at runtime.

bot:
  signature_header: "<!-- release-gate-bot:v1 -->"
  verdict_emoji:
    blocker: "❌"
    warning: "⚠️"
    informational: "ℹ️"
    unknown: "🆕"
  fallback_unknown:
    severity: warning
    owner: unknown
    override_path: exception-comment

  # Phase 2a (#1444) — synthesize a single 'Release-Gate Verdict' check on
  # release PRs. Read by scripts/release-gate/lib/conclusion-override.mjs +
  # comment.mjs::publishVerdict(). When enabled, the bot posts the comment
  # AND publishes a check-run via the Checks API:
  #   - conclusion=success when no blocker/warning failures (informational
  #     auto-bypassed)
  #   - conclusion=neutral when warning-only failures
  #   - conclusion=failure when ≥1 blocker
  # Reviewers gate on this single check instead of N per-row noise.
  #
  # Dispatch gate: stays `false` until Phase 2c (#1446) accumulates 14 days
  # of clean telemetry — see docs/for-developers/specs/2026-05-22-release-gate-phase2-overview.md.
  # Earliest enable: 2026-06-08. Flip to `true` then; no code changes needed.
  #
  # Default-true semantics: when this sub-key is missing or `enabled` is
  # absent, the bot defaults to publishing the verdict. We pin `false`
  # explicitly here to honor the dispatch gate.
  phase2a:
    enabled: false

  # Phase 2b (#1445) — auto-revert bot for main-staging post-merge blockers.
  # Ships kill-switched OFF; operator flips enabled=true to start dry-run period,
  # then dry_run_mode=false to enter live mode after AC-5 exit criterion satisfied.
  # See: docs/superpowers/specs/2026-06-21-issue-1445-release-gate-auto-revert-phase-2b-design.md
  phase2b:
    enabled: false
    dry_run_mode: true

  # Phase 2c (#1446) — weekly Slack digest of warning-tier classifications.
  # Read by scripts/release-gate/build-digest.mjs + lib/digest-builder.mjs.
  phase2c:
    enabled: true
    # Number of consecutive weeks the same `warning`-tier check must appear
    # before the digest flags it with `:warning:` "suggest reclassify to blocker".
    escalation_threshold_weeks: 4
    # Name of the env var bound to the Slack incoming webhook URL. The CLI
    # reads from `process.env[<this value>]`. Kept indirect for portability.
    slack_webhook_env: SLACK_GITNOTIFY_WEBHOOK_URL
