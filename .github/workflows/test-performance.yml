name: Performance Tests

# Consolidated performance testing: K6 load tests + Lighthouse CI
# Issue #2286: Workflow re-enabled after modernization
# Issue #2928: Extended with all API load test scenarios
#
# DISABLED since 2026-11-15 (`gh workflow disable`), by decision of the maintainer: the performance tests wait for the
# release to a staging server, and there is none (#4428). Neither the nightly K6 run nor the PR runs happen. To turn
# it back on: `gh workflow enable test-performance.yml`. What it measures and how it was proved: #4978, #5023, #5025.

on:
  schedule:
    # K6: Run nightly at 2 AM UTC (only on main branch)
    - cron: '0 2 * * *'
  pull_request:
    # Issue #1587: dropped main-staging from branches. Release PRs (main-dev →
    # main-staging) no longer trigger Performance Tests because the deploy-staging
    # workflow already runs `Snapshot Performance Baseline` + `Compare Performance
    # Baseline` post-deploy on the live staging environment. Running perf on the
    # release PR was redundant AND held the single self-hosted runner — when a
    # post-step log-upload hung (split-brain GHA token expiry), it starved the
    # Deploy to Staging job that needed the same runner (incident 2026-05-26).
    # Perf on PRs to main (production release) is preserved.
    #
    # #4978: PRs to main-dev run K6 too, but only when they change this workflow or tests/k6 (the `k6_self`
    # filter of Detect Changes). Until then nothing ran this workflow when its own code changed, and it stayed
    # red on the release PRs for causes that had nothing to do with the release.
    branches: [main, main-dev]
    paths:
      - 'apps/web/**'
      - 'apps/api/src/Api/Routing/**'
      - 'apps/api/src/Api/BoundedContexts/**'
      - 'tests/k6/**'
      - '.github/workflows/test-performance.yml'
      - '.github/actions/start-perf-api/**'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'K6 test type'
        required: false
        default: 'smoke'
        type: choice
        options:
          - smoke
          - load
          - stress
      k6_scenario:
        description: 'K6 scenario to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - admin-polling
          - user-dashboard
          - library-browsing
          - catalog-search
          - admin-concurrent
          - rag-isolated
          - rag-e2e
      run_lighthouse:
        description: 'Run Lighthouse CI'
        required: false
        default: true
        type: boolean
      run_k6:
        description: 'Run K6 tests'
        required: false
        default: true
        type: boolean
      notify_on_failure:
        description: 'Open or comment the "Performance Tests Failed" issue if the run fails, as the nightly run does (#4978)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: write

concurrency:
  group: test-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  API_BASE_URL: http://localhost:8080
  TEST_GAME_ID: '00000000-0000-0000-0000-000000000001'
  POSTGRES_USER: 'postgres'
  POSTGRES_PASSWORD: 'testpass123'
  POSTGRES_DB: 'meepleai_test'

jobs:
  changes:
    name: Detect Changes
    runs-on: ${{ vars.RUNNER && fromJSON(vars.RUNNER) || 'ubuntu-latest' }}
    # Issue #1587: explicit timeout so this self-hosted job (checkout +
    # paths-filter) can never tie up the single runner in a stuck teardown.
    # Completes the "timeout on every perf job" coverage started in #1594
    # (which pinned lighthouse-* and added their timeouts).
    timeout-minutes: 10
    outputs:
      web: ${{ steps.filter.outputs.web || 'true' }}
      api: ${{ steps.filter.outputs.api || 'true' }}
      k6: ${{ steps.filter.outputs.k6 || 'true' }}
      k6_self: ${{ steps.filter.outputs.k6_self || 'true' }}
      lighthouse_self: ${{ steps.filter.outputs.lighthouse_self || 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            web:
              - 'apps/web/**'
            api:
              - 'apps/api/**'
            k6:
              - 'tests/k6/**'
            k6_self:
              - 'tests/k6/**'
              - '.github/workflows/test-performance.yml'
              - '.github/actions/start-perf-api/**'
            lighthouse_self:
              - 'apps/web/lighthouserc.json'
              - 'apps/web/lighthouse-protected-pages.json'
              - '.github/workflows/test-performance.yml'
              - '.github/actions/start-perf-api/**'

  # ============================================
  # K6 PERFORMANCE TESTS
  # ============================================
  k6-tests:
    name: K6 Performance Tests
    runs-on: ${{ vars.RUNNER && fromJSON(vars.RUNNER) || 'ubuntu-latest' }}
    needs: changes
    timeout-minutes: 45
    # #4978: only on PRs, where release-gates.yml classifies the check as a warning. On the nightly run and on a
    # dispatch a red K6 now makes the run red, so notify-failure can fire: with `true` everywhere the run was
    # `success` with K6 in `failure`, and the alert never went off.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    # #4978: `inputs.run_k6` is a boolean; the old `!= 'false'` compared it with a string, which is never equal
    # (false → 0, 'false' → NaN), so unticking the input did not skip the job.
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.run_k6) ||
      (github.event_name == 'schedule') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main' && (needs.changes.outputs.api == 'true' || needs.changes.outputs.k6 == 'true')) ||
      (github.event_name == 'pull_request' && github.base_ref == 'main-dev' && needs.changes.outputs.k6_self == 'true')

    services:
      postgres:
        image: pgvector/pgvector:pg16  # Issue #3547: Use pgvector image for Vector column support
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_PASSWORD: 'testpass123'
          POSTGRES_DB: meepleai_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    # Note: pgvector removed (Issue #4861) - vector search uses pgvector inside PostgreSQL.

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup backend environment
        uses: ./.github/actions/setup-backend
        with:
          dotnet-version: '10.0.x'
          working-directory: apps/api
          cache-nuget: 'true'

      # #4978: k6 from the release tarball, at a fixed version checked against its sha256, on amd64 and arm64
      # alike. The apt repository needed a GPG key, which changed between the nightly runs of 2026-11-09 and
      # 2026-11-10 (`NO_PUBKEY C780D0BDB1A69C86`, exit 100); the arm64 branch downloaded `latest`.
      # To upgrade: the sha256 values are in k6-<version>-checksums.txt of the release.
      - name: Install k6 and Redis CLI
        env:
          K6_VERSION: v2.3.0
          K6_SHA256_AMD64: 39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1
          K6_SHA256_ARM64: 5ca3433e8201da72a284aaa241a1bb5fb47f4abb4e384d39410ddd8062f49b90
        run: |
          case "$(dpkg --print-architecture)" in
            amd64) K6_ARCH=amd64; K6_SHA256="$K6_SHA256_AMD64" ;;
            arm64) K6_ARCH=arm64; K6_SHA256="$K6_SHA256_ARM64" ;;
            *) echo "::error::No k6 tarball for architecture $(dpkg --print-architecture)"; exit 1 ;;
          esac
          K6_DIR="k6-${K6_VERSION}-linux-${K6_ARCH}"
          curl -fsSL --retry 3 -o k6.tar.gz "https://github.com/grafana/k6/releases/download/${K6_VERSION}/${K6_DIR}.tar.gz"
          echo "${K6_SHA256}  k6.tar.gz" | sha256sum -c -
          tar xzf k6.tar.gz
          sudo install -m 0755 "${K6_DIR}/k6" /usr/local/bin/k6
          rm -rf k6.tar.gz "${K6_DIR}"
          k6 version
          sudo apt-get update && sudo apt-get install -y redis-tools postgresql-client

      - name: Create test database
        run: |
          echo "Creating test database..."
          PGPASSWORD="testpass123" psql -h localhost -U "postgres" -d postgres <<-EOSQL
            SELECT 'CREATE DATABASE meepleai_test'
            WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'meepleai_test')\gexec
          EOSQL
          echo "Database ready"

      - name: Verify database connectivity
        run: |
          echo "Testing PostgreSQL connection..."
          PGPASSWORD="testpass123" psql -h localhost -U "postgres" -d postgres -c "SELECT version();"
          echo "Database connection successful"

      # #4978: the load-test account. The API seeds it as its initial admin, and k6 logs in with it both as user
      # and as admin. Before, k6 used the defaults of tests/k6/utils/shared-config.js, which no seed creates: on
      # #4897 every login answered 400. The password is made here, since the database lives as long as the job.
      - name: Generate load-test credentials
        run: |
          password="K6-$(openssl rand -hex 16)-Ci1"
          echo "::add-mask::$password"
          {
            echo "K6_ADMIN_EMAIL=k6-admin@example.com"
            echo "K6_ADMIN_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      # #5025: build, migrations, start, wait and the preflight login are in the composite action, shared with
      # Lighthouse CI. The login stops the job with the status the API returned (#4978).
      - name: Start the API
        uses: ./.github/actions/start-perf-api
        with:
          admin-email: ${{ env.K6_ADMIN_EMAIL }}
          admin-password: ${{ env.K6_ADMIN_PASSWORD }}

      - name: Run k6 performance tests
        working-directory: tests/k6
        timeout-minutes: 30
        env:
          K6_TEST_TYPE: ${{ inputs.test_type || 'smoke' }}
          K6_SCENARIO: ${{ inputs.k6_scenario || 'all' }}
          TEST_USER_EMAIL: ${{ env.K6_ADMIN_EMAIL }}
          TEST_USER_PASSWORD: ${{ env.K6_ADMIN_PASSWORD }}
          TEST_ADMIN_EMAIL: ${{ env.K6_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ env.K6_ADMIN_PASSWORD }}
        run: |
          # Determine test type
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            TEST_TYPE="smoke"
            SCENARIO="all"
            echo "PR detected - running smoke tests for all scenarios"
          elif [ "${{ github.event_name }}" == "schedule" ]; then
            TEST_TYPE="smoke"
            SCENARIO="all"
            echo "Scheduled run - running smoke tests for all scenarios"
          else
            TEST_TYPE="${K6_TEST_TYPE}"
            SCENARIO="${K6_SCENARIO}"
            echo "Manual run - running ${TEST_TYPE} test for scenario: ${SCENARIO}"
          fi

          # #4978: the script keeps every scenario's exit code (no more `|| true`), fails if one is not 0, and
          # writes the duration of each scenario to the step summary. In smoke a scenario fails on auth_errors
          # and checks only; latency stays informative (thresholdsFor in utils/shared-config.js).
          bash utils/run-scenarios.sh "$TEST_TYPE" "$SCENARIO"

      # Issue #5542: Baseline regression gate
      - name: Run baseline regression check
        if: always()
        working-directory: tests/k6
        run: |
          chmod +x utils/baseline-compare.sh
          set +e
          utils/baseline-compare.sh reports
          rc=$?
          set -e
          # #4978: no summary means k6 produced nothing to compare, which used to pass as "no regression".
          if [ "$rc" -eq 3 ]; then
            echo "::error::No k6 summary in tests/k6/reports: the baseline check has nothing to compare"
            exit 1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "✅ Baseline regression check passed"
          else
            echo "❌ Baseline regression check failed — performance regression detected"
            # On PR, post the report as a comment
            if [ "${{ github.event_name }}" == "pull_request" ] && [ -f reports/baseline-comparison.md ]; then
              gh pr comment ${{ github.event.pull_request.number }} --body-file reports/baseline-comparison.md || true
            fi
            # Don't fail the workflow on smoke tests (informational only)
            if [ "${{ inputs.test_type || 'smoke' }}" != "smoke" ]; then
              exit 1
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Debug API logs on failure
        if: failure()
        run: |
          echo "========================================="
          echo "API Logs"
          echo "========================================="
          tail -n 200 api.log 2>/dev/null || echo "No API logs found"
          echo ""
          echo "========================================="
          echo "Health Check Status"
          echo "========================================="
          curl -v http://localhost:8080/health 2>&1 || echo "Health check failed"

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-performance-reports-${{ github.run_number }}
          path: tests/k6/reports/
          retention-days: 30

      - name: Archive API logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-api-logs-${{ github.run_number }}
          path: api.log
          retention-days: 7

      - name: Cleanup resources
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill $(cat api.pid) 2>/dev/null || true
            rm api.pid
          fi
          pkill -f "dotnet.*Api" 2>/dev/null || true
          redis-cli FLUSHALL 2>/dev/null || true
          echo "Cleanup complete"

  # ============================================
  # LIGHTHOUSE CI
  # ============================================
  lighthouse-build:
    name: Build Next.js (Lighthouse)
    # Issue #1587: pinned to ubuntu-latest (was: vars.RUNNER fallback). This
    # job is a pure Next.js production build — it doesn't touch staging and has
    # no reason to compete with deploy-staging for the single self-hosted runner.
    # timeout-minutes: 30 added so a hang (Node OOM, network stall) can't tie up
    # the runner indefinitely.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    # #4978: `inputs.run_lighthouse` is a boolean, as for run_k6 above. PRs to main-dev build for Lighthouse
    # only when they change this workflow or apps/web/lighthouserc.json (the `lighthouse_self` filter). There is no
    # `push` condition any more: this workflow has no push trigger.
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.run_lighthouse) ||
      (github.event_name == 'pull_request' && github.base_ref == 'main' && needs.changes.outputs.web == 'true') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main-dev' && needs.changes.outputs.lighthouse_self == 'true')
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup frontend environment
        uses: ./.github/actions/setup-frontend
        with:
          pnpm-version: '10'
          working-directory: apps/web
          frozen-lockfile: 'true'

      - name: Setup Test Environment
        run: cp .env.test.example .env.test

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ hashFiles('apps/web/pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ hashFiles('apps/web/pnpm-lock.yaml') }}-
            ${{ runner.os }}-${{ runner.arch }}-nextjs-

      - name: Build Next.js for Production
        run: pnpm exec cross-env NODE_OPTIONS="--max-old-space-size=6144 --require ./scripts/dommatrix-polyfill.js" node ./node_modules/next/dist/bin/next build
        env:
          NODE_ENV: production

      # #4978: `.next/` and `.env.test` are both hidden, and upload-artifact skips hidden files by default since
      # v4.4: the artifact came out empty ("No files were found"), and Lighthouse CI stopped on "Artifact not
      # found". `next start` needs neither the build cache nor the standalone copy. Keep `.env.test` in the list:
      # with it the artifact root is apps/web/, which is where Lighthouse CI downloads it.
      - name: Upload Next.js Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-build-lighthouse-${{ github.sha }}
          path: |
            apps/web/.next/
            !apps/web/.next/cache
            !apps/web/.next/standalone
            apps/web/.env.test
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  lighthouse-ci:
    name: Lighthouse CI
    # Issue #1587: pinned to ubuntu-latest + explicit timeout. Lighthouse runs on
    # the build artifact, served by `next start` (startServerCommand of
    # lighthouserc.json) — no staging dependency. Same rationale as
    # lighthouse-build: no reason to share the single self-hosted runner used by
    # deploy-staging.
    runs-on: ubuntu-latest
    # #5025: 45 like K6, since the job now builds and starts the API.
    timeout-minutes: 45
    needs: [changes, lighthouse-build]
    # #5023: only on PRs, as for K6 (#4978), where release-gates.yml classifies the check as a warning. With `true`
    # everywhere a dispatch ended `success` with Lighthouse CI in `failure`, and notify-failure could not fire.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    # #5025: the API the protected pages need, as in the K6 job.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_PASSWORD: 'testpass123'
          POSTGRES_DB: meepleai_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup frontend environment
        uses: ./.github/actions/setup-frontend
        with:
          pnpm-version: '10'
          working-directory: apps/web
          frozen-lockfile: 'true'

      - name: Download Next.js Build
        uses: actions/download-artifact@v8
        with:
          name: nextjs-build-lighthouse-${{ github.sha }}
          path: apps/web

      # #4978: `pnpm exec lhci` had nothing to run: @lhci/cli is not a dependency of apps/web, so once the artifact
      # existed the step would have stopped on "command not found". Pinned to an exact version, as bats is in
      # dev-fast.yml.
      - name: Install Lighthouse CI
        run: |
          npm install --global @lhci/cli@0.15.1
          lhci --version

      # #5025: the protected pages are measured as an admin of the job's own API. The password is made here, since
      # the database lives as long as the job.
      - name: Generate Lighthouse credentials
        run: |
          password="LH-$(openssl rand -hex 16)-Ci1"
          echo "::add-mask::$password"
          {
            echo "LH_ADMIN_EMAIL=lighthouse-admin@example.com"
            echo "LH_ADMIN_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Setup backend environment
        uses: ./.github/actions/setup-backend
        with:
          dotnet-version: '10.0.x'
          working-directory: apps/api
          cache-nuget: 'true'

      - name: Start the API
        id: api
        uses: ./.github/actions/start-perf-api
        with:
          admin-email: ${{ env.LH_ADMIN_EMAIL }}
          admin-password: ${{ env.LH_ADMIN_PASSWORD }}

      # #4978: collect, assert and upload were a single `lhci autorun`. Split, so that a report of the wrong page
      # stops the job before its scores are asserted. NEXT_COMPRESS turns on the compression of `next start`
      # (next.config.js): deployed, the edge compresses. Without it each page weighed about 3 MB, about 2 MB of
      # which was CSS and JS that compression saves (run 43697897745).
      - name: Collect Lighthouse reports
        id: lhci-collect
        run: lhci collect
        env:
          NEXT_COMPRESS: 'true'

      # #5025: the protected pages, with the session of the admin above. Same lighthouserc.json: `--url` replaces its
      # list of public pages (with the session `/` redirects to the signed-in area), `--settings.extraHeaders` adds
      # to its settings, and `--additive` keeps the public reports. Not `extends` in a second rc file: lhci merges
      # its arrays index by index, so a shorter list would inherit the last public pages.
      - name: Collect Lighthouse reports of the protected pages
        id: lhci-collect-protected
        env:
          NEXT_COMPRESS: 'true'
          SESSION_COOKIE: ${{ steps.api.outputs.session-cookie }}
        run: |
          urls=()
          while IFS= read -r url; do
            urls+=("--url=$url")
          done < <(jq -r '.urls[]' lighthouse-protected-pages.json)
          headers=$(jq -cn --arg cookie "$SESSION_COOKIE" '{Cookie: $cookie}')
          lhci collect --additive "${urls[@]}" "--settings.extraHeaders=$headers"

      # #5025: a report keeps its settings, extraHeaders included, and the HTML report embeds them too. The session
      # goes before any upload: the reports end up in an artifact and in temporary public storage.
      - name: Remove the session from the reports
        id: redact
        if: always() && steps.lhci-collect-protected.outcome != 'skipped'
        env:
          SESSION_COOKIE: ${{ steps.api.outputs.session-cookie }}
        run: |
          python3 - <<'EOF'
          import os
          import pathlib

          values = [pair.split("=", 1)[1] for pair in os.environ["SESSION_COOKIE"].split("; ") if "=" in pair]
          values = [v for v in values if v]
          if not values:
              raise SystemExit("no cookie value to remove")
          redacted = 0
          for path in pathlib.Path(".lighthouseci").glob("*"):
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8", errors="surrogateescape")
              new = text
              for value in values:
                  new = new.replace(value, "REDACTED")
              if new != text:
                  path.write_text(new, encoding="utf-8", errors="surrogateescape")
                  redacted += 1
              if any(value in path.read_text(encoding="utf-8", errors="surrogateescape") for value in values):
                  raise SystemExit(f"{path}: the session is still there")
          print(f"session removed from {redacted} files")
          EOF

      # #4978: a page that redirects is measured under the name of the page requested: before #4978 the protected
      # pages ended on /login. This step fails when a report measured another page (a redirect) or none (a
      # runtime error), the public pages and the protected ones alike: a protected page on /login means the
      # session above did not reach it (#5025).
      - name: Check that each report measured the requested page
        run: |
          shopt -s nullglob
          reports=(.lighthouseci/lhr-*.json)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "::error::lhci collect wrote no report into apps/web/.lighthouseci/"
            exit 1
          fi
          {
            echo "### Pages measured by Lighthouse"
            echo
            echo "| requested | measured | verdict |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          wrong=0
          for lhr in "${reports[@]}"; do
            requested=$(jq -r '.requestedUrl // ""' "$lhr" | sed -E 's|^[a-z]+://[^/]+||; s|[?#].*$||')
            measured=$(jq -r '.finalDisplayedUrl // .finalUrl // ""' "$lhr" | sed -E 's|^[a-z]+://[^/]+||; s|[?#].*$||')
            runtime_error=$(jq -r '.runtimeError.code // ""' "$lhr")
            verdict=ok
            if [ -n "$runtime_error" ]; then
              verdict="runtime error $runtime_error"
            elif [ "$measured" != "$requested" ]; then
              verdict=redirected
            fi
            echo "| \`$requested\` | \`$measured\` | $verdict |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$verdict" != ok ]; then
              echo "::error file=apps/web/lighthouserc.json::$requested: $verdict, measured '$measured' ($lhr)"
              wrong=$((wrong + 1))
            fi
          done
          echo "reports: ${#reports[@]}, of another page or of none: $wrong"
          [ "$wrong" -eq 0 ]

      - name: Assert Lighthouse budgets
        run: lhci assert

      # #5025: never with the session still in the reports.
      - name: Upload reports to temporary public storage
        if: always() && steps.lhci-collect.outcome == 'success' && steps.redact.outcome != 'failure'
        run: lhci upload
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN || secrets.GITHUB_TOKEN }}

      # #4978: `.lighthouseci/` is hidden too, like `.next/` above. #5025: never with the session still in the reports.
      - name: Upload Lighthouse CI Results
        if: always() && steps.redact.outcome != 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-ci-results-${{ github.run_number }}
          path: apps/web/.lighthouseci/
          include-hidden-files: true
          retention-days: 7

      # #4978: one row per page, from its median run by performance score, named after the page measured. The old
      # step looked for a manifest.json, which only `lhci upload --target filesystem` writes, so its table was
      # always empty; and it named the page requested.
      - name: Extract Lighthouse Metrics
        id: lighthouse-metrics
        if: always() && steps.lhci-collect.outcome == 'success'
        run: |
          shopt -s nullglob
          reports=(.lighthouseci/lhr-*.json)
          [ "${#reports[@]}" -gt 0 ] || exit 0
          SUMMARY=$(jq -rs '
            group_by(.requestedUrl)[]
            | sort_by(.categories.performance.score // 0)
            | .[length / 2 | floor]
            | [ (.finalDisplayedUrl // .finalUrl // "" | sub("^[a-z]+://[^/]+"; "")),
                "\((.categories.performance.score // 0) * 100 | round)%",
                "\((.categories.accessibility.score // 0) * 100 | round)%",
                "\((.audits["first-contentful-paint"].numericValue // 0) / 10 | round / 100)s",
                "\((.audits["largest-contentful-paint"].numericValue // 0) / 10 | round / 100)s",
                "\(.audits["total-blocking-time"].numericValue // 0 | round)ms",
                "\((.audits["cumulative-layout-shift"].numericValue // 0) * 1000 | round / 1000)" ]
            | "| " + join(" | ") + " |"
          ' "${reports[@]}")
          {
            echo "summary<<EOF"
            echo "$SUMMARY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Archive API logs
        if: always() && steps.api.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-api-logs-${{ github.run_number }}
          path: api.log
          retention-days: 7

      - name: Stop the API
        if: always()
        working-directory: .
        run: |
          if [ -f api.pid ]; then
            kill "$(cat api.pid)" 2>/dev/null || true
            rm api.pid
          fi
          pkill -f "dotnet.*Api" 2>/dev/null || true

      - name: Comment PR with Performance Results
        if: always() && github.event_name == 'pull_request' && steps.lhci-collect.outcome == 'success'
        uses: actions/github-script@v8
        env:
          SUMMARY: ${{ steps.lighthouse-metrics.outputs.summary }}
        with:
          script: |
            const summary = process.env.SUMMARY;

            const comment = `## 🚀 Lighthouse CI Performance Report

            The public pages of \`apps/web/lighthouserc.json\`, without a session (#4978), and the protected pages of \`apps/web/lighthouse-protected-pages.json\`, as an admin of the job's own API (#5025).

            ### Core Web Vitals Budgets (Desktop)
            | Metric | Budget |
            |--------|--------|
            | FCP (First Contentful Paint) | < 1.8s |
            | LCP (Largest Contentful Paint) | < 2.5s |
            | TBT (Total Blocking Time) | < 300ms |
            | CLS (Cumulative Layout Shift) | < 0.1 |

            Whether each budget held is in the \`Assert Lighthouse budgets\` step of this job.

            ### Per-Page Results (median run)
            | Page | Perf | A11y | FCP | LCP | TBT | CLS |
            |------|------|------|-----|-----|-----|-----|
            ${summary || '| (No data available) | - | - | - | - | - | - |'}

            ### Category Score Targets
            - 🎯 Performance: ≥ 90%
            - ♿ Accessibility: ≥ 90%
            - ✅ Best Practices: ≥ 90%
            - 🔍 SEO: ≥ 80%

            📊 Full reports available in [workflow artifacts](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).
            `;

            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Lighthouse CI Performance Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  # ============================================
  # FAILURE NOTIFICATION
  # ============================================
  notify-failure:
    name: Notify on Failure
    runs-on: ${{ vars.RUNNER && fromJSON(vars.RUNNER) || 'ubuntu-latest' }}
    # Issue #1587: explicit timeout — completes the "every perf job" coverage.
    timeout-minutes: 10
    needs: [k6-tests, lighthouse-ci]
    # #4978: a dispatch with notify_on_failure fires it too, so the alert can be proved without waiting for a red
    # nightly run. It never fired before: K6 had `continue-on-error: true`, so the run was never a failure.
    if: failure() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.notify_on_failure))
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create GitHub issue on failure
        uses: actions/github-script@v8
        env:
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'Scheduled (nightly)' || 'Manual dispatch (notify_on_failure)' }}
        with:
          script: |
            const { RUN_ID, REF, TRIGGER } = process.env;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'performance,automated',
              per_page: 100
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.includes('Performance Tests Failed')
            );

            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${RUN_ID}`;
            const timestamp = new Date().toISOString();
            const branch = REF.replace('refs/heads/', '');

            const comment = `## Performance Test Failure - ${timestamp}

            **Run:** [#${RUN_ID}](${runUrl})
            **Branch:** ${branch}
            **Trigger:** ${TRIGGER}

            ### Action Required
            The performance tests have failed. Please investigate the workflow run for details.

            ### Common Issues to Check
            - [ ] API response times exceeding thresholds
            - [ ] Increased error rates
            - [ ] Database connection issues
            - [ ] Memory or resource constraints
            - [ ] Breaking changes in recent commits

            ### Next Steps
            1. Review the [workflow run](${runUrl}) logs
            2. Check the performance reports artifact
            3. Investigate and fix the root cause
            4. Re-run the workflow to verify the fix
            5. Close this issue once resolved`;

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: comment
              });
              console.log(`Added comment to existing issue #${existingIssue.number}`);
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Performance Tests Failed - Investigation Required',
                body: comment,
                labels: ['performance', 'automated', 'bug', 'priority-high']
              });
              console.log(`Created new issue #${issue.data.number}`);
            }
