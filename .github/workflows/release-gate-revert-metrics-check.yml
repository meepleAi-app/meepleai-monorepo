name: Release-gate Revert Metrics Check (Phase 2b)

# Phase 2b (#1445) — weekly AC-7 breach detector.
# Reads JSONL state branch + invokes reconcile-revert-outcomes.mjs --metrics-only.
# If false-revert rate > 2% over 30d → auto-creates P0 issue.
#
# Spec: docs/superpowers/specs/2026-06-21-issue-1445-release-gate-auto-revert-phase-2b-design.md

on:
  schedule:
    - cron: "0 9 * * 1"       # Lunedì 09:00 UTC (post-reconcile 07 UTC + post-digest 08 UTC)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: AC-7 breach check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d
        with:
          version: 9

      - name: Install release-gate deps
        working-directory: scripts/release-gate
        run: pnpm install --frozen-lockfile

      # #4937: with Phase 2b kill-switched off there are no revert events and no state branch, so the
      # check failed on every weekly run since the first one (2026-06-22) — a red nobody read. While
      # bot.phase2b.enabled is false there is nothing to measure: say so and stop green.
      - name: Phase 2b kill-switch
        id: gate
        working-directory: scripts/release-gate
        run: |
          ENABLED=$(node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import yaml from 'js-yaml';
            const gates = yaml.load(readFileSync('../../.github/release-gates.yml', 'utf8'));
            console.log(gates?.bot?.phase2b?.enabled === true ? 'true' : 'false');
          ")
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          if [ "$ENABLED" != "true" ]; then
            echo "::notice::bot.phase2b.enabled is false in .github/release-gates.yml — no revert events to measure, check skipped."
          fi

      - name: Run --metrics-only
        id: metrics
        if: steps.gate.outputs.enabled == 'true'
        working-directory: scripts/release-gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT=$(node reconcile-revert-outcomes.mjs --metrics-only)
          echo "metrics=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" | jq .

      - name: Open issue on breach
        if: steps.gate.outputs.enabled == 'true' && fromJSON(steps.metrics.outputs.metrics).breach == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METRICS_JSON: ${{ steps.metrics.outputs.metrics }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          RATE=$(printf '%s' "$METRICS_JSON" | jq -r .false_revert_rate)
          # Validate RATE matches numeric pattern before using it
          [[ "$RATE" =~ ^[0-9.]+$ ]] || { echo "invalid rate: $RATE"; exit 1; }
          BODY=$(cat <<EOF
          AC-7 breached: \`false_revert_rate=$RATE\` > 0.02 (2%) over 30d rolling window.

          **Required action**:
          1. Review JSONL events on branch \`release-gate-state/auto-revert-events\`
          2. Decide: (a) Flip \`bot.phase2b.enabled: false\` in \`.github/release-gates.yml\` (emergency stop), OR (b) investigate each false_positive event and improve detection logic before next run.

          Metrics snapshot:
          \`\`\`json
          $METRICS_JSON
          \`\`\`

          🤖 Auto-created by [release-gate-revert-metrics-check.yml]($RUN_URL)
          EOF
          )
          gh issue create \
            --title "🚨 Phase 2b false-revert rate breach — $RATE" \
            --label "release-gate,phase2b,breach,blocker" \
            --body "$BODY"
