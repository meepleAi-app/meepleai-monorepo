name: Validate Workflow Cache Patterns

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/dependabot.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - 'scripts/validate-workflows.js'
      - 'scripts/validate-github-labels.js'
  push:
    branches:
      - main
      - main-dev
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/dependabot.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - 'scripts/validate-workflows.js'
      - 'scripts/validate-github-labels.js'


# Q2 2026 Security Review (#186) P1.2 AC5: default least-privilege.
# Job-level permissions blocks (where present) override this default.

# Concurrency: prevent duplicate runs. See issue #850.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-workflow-patterns:
    name: Validate pnpm Cache Patterns
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # #3895: le label stanno sotto l'API Issues; senza questo il gate
      # non puo' leggerle e si ferma con exit 2 invece di dire "tutto ok".
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Validate workflow files
        run: node scripts/validate-workflows.js

      # #3895: ogni label citata in .github/ deve esistere davvero. Un
      # riferimento a una label inesistente non fallisce, viene ignorato:
      # e' cosi' che `auto-dependabot.yml` e' rimasto inerte per mesi.
      - name: Validate GitHub labels (#3895)
        run: node scripts/validate-github-labels.js --list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
