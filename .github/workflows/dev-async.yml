# Dev Async — non-blocking heavy checks on push to main-dev
#
# Per ADR-054 and epic #842 / issue #846: heavier integration + E2E suites
# run AFTER the merge to main-dev, not on the PR. Target SLO < 15 min.
# Failures here trigger the auto-revert bot (#843) once that lands; in the
# meantime, repeated red runs surface in the nightly digest (#850).
#
# This workflow does NOT gate PR merges. The hot path is dev-fast.yml.
name: Dev Async

on:
  push:
    branches: [main-dev]
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'apps/orchestration-service/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'global.json'
      - '.github/workflows/dev-async.yml'
      - '.github/actions/**'
  workflow_dispatch:

# `cancel-in-progress: false` NON accoda una fila. A gruppo occupato GitHub mette la nuova run
# pending e cancella la pending PRECEDENTE: la run in volo arriva quindi sempre in fondo, e quando
# lo slot si libera parte l'ultimo sha. È un debounce, non un backlog.
#
# Con `true`, un gate da ~83 minuti su un branch che riceve merge ogni 40-70 non aveva finestra: il
# 2026-08-17 nove run su quindici erano `cancelled`, e lo shard Games — l'ultimo a chiudere — non
# arrivava quasi mai in fondo. Un `cancelled` si legge come «annullato», non come «fallito»:
# `dev-auto-revert` lo classifica `green-pending` e non fa nulla, quindi su main-dev non esisteva
# alcun esito, né verde né rosso. È lo stesso difetto di #3629 su un altro asse.
concurrency:
  group: dev-async-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      orchestration: ${{ steps.filter.outputs.orchestration }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Issue #850: filter patterns must cover ALL paths that trigger
          # this workflow (see dev-fast.yml for rationale).
          filters: |
            frontend:
              - 'apps/web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/dev-async.yml'
              - '.github/actions/setup-frontend/**'
              - '.github/actions/setup-playwright/**'
            backend:
              - 'apps/api/**'
              - 'global.json'
              - '.github/workflows/dev-async.yml'
              - '.github/actions/setup-backend/**'
            orchestration:
              - 'apps/orchestration-service/**'

  # Issue #3629: questo job andava in timeout su 18 run su 20 e GitHub lo marcava `cancelled`.
  # Un `cancelled` si legge come «annullato», non come «fallito», quindi per settimane su main-dev
  # NON è esistito alcun esito per i ~3000 test Category=Integration — né verde né rosso — e i
  # [FAIL] reali nel log non hanno mai prodotto un segnale.
  #
  # La causa non era il timeout in sé: questo job divergeva da ci.yml su tutto ciò che rende gli
  # integration test eseguibili in tempi sani. Ogni fixture avviava Testcontainers da zero (ci.yml
  # passa TEST_POSTGRES_CONNSTRING / TEST_REDIS_CONNSTRING e SharedTestcontainersFixture li salta),
  # mancavano libgdiplus e i file secret, e non c'era sharding. Ora il percorso è lo stesso.
  backend-integration:
    name: Backend Integration (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    # Il job sta SOPRA il TestSessionTimeout perché qui build Release, apt-get e setup sono dentro
    # il job, mentre ci.yml scarica un artifact già costruito. Con job a 50 e sessione a 45 il job
    # moriva prima — ai test restavano ~44 min — e si tornava a un `cancelled`.
    #
    # Il numero NON è una stima. Tre tentativi con soglie più basse hanno abortito ogni shard a
    # metà: 625/910, 423/1123, 558/929 a 30 min di job, e poi 2148/2962 complessivi a 45 min di
    # sessione. Il riferimento di PR #1505 («each shard runs ~29-30 min of real work») è da
    # scartare: veniva da ci.yml, che in quel periodo non eseguiva alcun test (#3632).
    #
    # Resta la RETE DI SICUREZZA: a scattare per primo dev'essere il TestSessionTimeout, perché
    # produce un riepilogo leggibile, mentre il timeout del job dà un `cancelled` muto — che è il
    # difetto da cui parte questa issue.
    #
    # #3634: 60 → 90, di pari passo con il TestSessionTimeout portato da 45 a 75 min. A 45 la
    # sessione veniva troncata: nel primo run che ha davvero eseguito i test, i tre shard si sono
    # fermati a ~44m30s con `Test Run Aborted.` lasciando ~800 test non raggiunti. 2148 test in 44
    # minuti danno ~61 minuti per l'intera selezione; 75 + 90 conserva il margine E l'ordine giusto
    # fra le due soglie.
    timeout-minutes: 90
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false  # uno shard rosso non deve nascondere l'esito degli altri
      matrix:
        # Stessa ripartizione di ci.yml, deliberatamente: se i due gate misurassero insiemi diversi,
        # un test potrebbe non essere eseguito da nessuno dei due — il difetto di #3622 su un altro
        # asse. Misurati 2950 test totali (esclusioni incluse): 910 / 1123 / 929.
        shard:
          - name: "KnowledgeBase"
            filter_extra: "&(FullyQualifiedName~KnowledgeBase|FullyQualifiedName~DocumentProcessing|FullyQualifiedName~Authentication)"
          - name: "Games"
            filter_extra: "&(FullyQualifiedName~SharedGameCatalog|FullyQualifiedName~GameManagement|FullyQualifiedName~Administration)"
          - name: "Core"
            filter_extra: "&FullyQualifiedName!~KnowledgeBase&FullyQualifiedName!~DocumentProcessing&FullyQualifiedName!~Authentication&FullyQualifiedName!~SharedGameCatalog&FullyQualifiedName!~GameManagement&FullyQualifiedName!~Administration"

    # Stessi service container di ci.yml: sostituiscono i Testcontainers avviati per-fixture, che
    # erano il vero costo.
    services:
      postgres:
        image: pgvector/pgvector:pg16  # Issue #3547: pgvector per le colonne Vector
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: meepleai_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --shm-size=256mb
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v6

      # libgdiplus: senza, i test che toccano il rendering PDF non falliscono subito ma dopo un
      # timeout, e il costo si somma su tutta la suite. È una delle differenze che rendevano questo
      # job molto più lento di ci.yml a parità di test.
      - name: Install PDF Dependencies
        run: sudo apt-get update && sudo apt-get install -y libgdiplus redis-tools

      - uses: ./.github/actions/setup-backend
        with:
          dotnet-version: '9.0.x'
          working-directory: apps/api
          cache-version: ${{ vars.CACHE_VERSION || 'v1' }}

      - name: Build (Release)
        working-directory: apps/api
        run: dotnet build --no-restore --configuration Release

      # I service container sono dichiarati `healthy` da Docker prima di accettare davvero
      # connessioni applicative: attendere qui evita che i primi test paghino retry di connessione.
      - name: Wait for Services
        timeout-minutes: 3
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done
          until redis-cli -h localhost -p 6379 ping > /dev/null 2>&1; do sleep 1; done
          echo "postgres + redis ready"

      # Stessi file di ci.yml: senza, i percorsi che leggono i secret cadono su path di errore
      # lenti invece di partire configurati.
      - name: Create CI Secret Files
        run: |
          mkdir -p infra/secrets
          printf 'POSTGRES_USER=postgres\nPOSTGRES_PASSWORD=testpass\nPOSTGRES_DB=meepleai_test\n' > infra/secrets/database.secret
          printf 'REDIS_PASSWORD=redis-ci-test\n' > infra/secrets/redis.secret
          printf 'JWT_SECRET_KEY=ci-test-jwt-secret-key-minimum-32-chars-long\nJWT_ISSUER=meepleai-ci-test\nJWT_AUDIENCE=meepleai-ci-test\n' > infra/secrets/jwt.secret
          printf 'ADMIN_EMAIL=admin@test.local\nADMIN_PASSWORD=CiTestPassword123!\nADMIN_DISPLAY_NAME=CI Admin\nINITIAL_ADMIN_EMAIL=admin@test.local\nINITIAL_ADMIN_DISPLAY_NAME=CI Admin\n' > infra/secrets/admin.secret
          printf 'EMBEDDING_SERVICE_URL=http://localhost:8000\n' > infra/secrets/embedding-service.secret

      - name: Integration tests
        working-directory: apps/api
        env:
          # MaxPoolSize=2 + ClearAllPools() nel teardown: evita l'accumulo contro max_connections.
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=meepleai_test;Username=postgres;Password=testpass;MaxPoolSize=2;Timeout=30;Command Timeout=60
          # Queste due sono il punto: SharedTestcontainersFixture le legge e NON avvia i container.
          TEST_POSTGRES_CONNSTRING: Host=localhost;Port=5432;Database=meepleai_test;Username=postgres;Password=testpass;MaxPoolSize=2;Timeout=30;Command Timeout=60
          TEST_REDIS_CONNSTRING: localhost:6379,allowAdmin=true
          REDIS_URL: localhost:6379,allowAdmin=true
          OPENROUTER_API_KEY: test-key
          CI: true
          DISABLE_RATE_LIMITING: "true"  # Issue #3102: evita i 429 nei test di integrazione
          # Passate anche singolarmente come in ci.yml: alcuni percorsi le leggono direttamente
          # invece della connection string completa.
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: meepleai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        run: |
          # `set -o pipefail` è obbligatorio: senza, l'exit code che arriva a GitHub è quello di
          # `tee` (sempre 0) e un `Test Run Aborted.` passerebbe per successo.
          set -o pipefail
          # Target esplicito del .csproj (PR #1505): `dotnet test` sulla solution invocherebbe anche
          # Api.Analyzers.Tests.dll, che non ha test Category=Integration, e vstest tratta il
          # no-match su un assembly non vuoto come exit 1.
          #
          # Stesse esclusioni per nome di ci.yml, così i due gate misurano lo stesso insieme: una
          # divergenza qui riporterebbe il difetto di #3622 (test che nessun gate esegue) su un
          # altro asse.
          #
          # NESSUN override di TestSessionTimeout: valgono i 75 min del runsettings condiviso (#3634).
          dotnet test tests/Api.Tests/Api.Tests.csproj \
            --filter "Category=Integration&FullyQualifiedName!~UploadPdfMidPhaseCancellationTests&FullyQualifiedName!~FrontendSdk&FullyQualifiedName!~ArbitroAgent${{ matrix.shard.filter_extra }}" \
            --settings tests/Api.Tests/integration.runsettings \
            --no-build \
            --configuration Release \
            --logger "console;verbosity=minimal" \
            --blame-hang-timeout 5min \
            2>&1 | tee "integration-${{ matrix.shard.name }}.log"

      # #3632/#3633 — il verde va misurato, non dichiarato, e il troncamento va NOMINATO.
      #
      # `Aborting test run: test run timeout` esce già 134 e fa fallire lo step, quindi questo guard
      # non introduce un rosso nuovo: rende distinguibile «la selezione non è stata misurata per
      # intero» da «alcuni test sono falliti». Sono due fatti diversi e finora erano lo stesso colore.
      #
      # `!cancelled()` e non `always()`: su una cancellazione non c'è niente da misurare.
      - name: 'Guard: la selezione e stata misurata per intero (#3633)'
        if: ${{ !cancelled() }}
        working-directory: apps/api
        env:
          SHARD: ${{ matrix.shard.name }}
        run: |
          set -uo pipefail
          status=0
          log="integration-${SHARD}.log"

          if [ ! -f "$log" ]; then
            echo "::error::Shard ${SHARD}: log assente, lo step dei test non e partito."
            exit 1
          fi

          mapfile -t trx_files < <(find . -name 'integration-test-results.trx' -print)
          if [ ${#trx_files[@]} -eq 0 ]; then
            echo "::error::Shard ${SHARD}: nessun .trx, nessun test eseguito."
            status=1
          fi

          executed=0
          for f in "${trx_files[@]}"; do
            n=$(sed -n 's/.*<Counters[^>]* executed="\([0-9]\{1,\}\)".*/\1/p' "$f" | head -1)
            if ! [[ "${n:-}" =~ ^[0-9]+$ ]]; then
              echo "::error::$f: counter 'executed' illeggibile (trx malformato?)."
              status=1
              continue
            fi
            echo "  $f -> executed=$n"
            executed=$((executed + n))
          done

          # Soglia bassa e deliberata: distingue «e girato» da «zero», non pinna un numero.
          if [ "$executed" -lt 100 ]; then
            echo "::error::Shard ${SHARD}: solo $executed test eseguiti, sarebbe stato verde senza eseguire nulla (#3632)."
            status=1
          fi

          summary=$(grep -aE '^(Passed|Failed)!  -' "$log" | tail -1)
          {
            echo "### Backend Integration — ${SHARD}"
            echo
            echo '```'
            echo "${summary:-(riepilogo non trovato nel log)}"
            echo '```'
            echo
            echo "Baseline attesa per shard: Core 9 · KnowledgeBase 4 · Games 3 (#3633)."
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -qa 'Aborting test run: test run timeout' "$log"; then
            echo "::error::Shard ${SHARD} TRONCATO: il TestSessionTimeout e scattato. La selezione NON e stata misurata per intero: i conteggi qui sopra sono parziali e non confrontabili con una baseline completa (#3633)."
            {
              echo
              echo "> ⚠️ **Shard troncato** — sessione abortita sul TestSessionTimeout. Conteggi parziali."
            } >> "$GITHUB_STEP_SUMMARY"
            status=1
          fi

          exit $status

      # Le durate per-test del .trx sono l'unico modo di attribuire un guadagno o una regressione a
      # una causa. Il runsettings il .trx lo produce già (integration-test-results.trx): finora
      # nessuno lo raccoglieva, quindi ogni ipotesi sulle prestazioni della suite restava tale.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-results-${{ matrix.shard.name }}
          path: |
            apps/api/**/integration-test-results.trx
            apps/api/integration-*.log
          retention-days: 14
          if-no-files-found: warn
