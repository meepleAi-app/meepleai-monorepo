name: Release-gate Comment

# Auto-classifies CI failures on release PRs (main-dev → main-staging)
# and posts/edits a single bot comment with severity + owner + override path.
#
# Implementation: scripts/release-gate/comment.mjs
# Classification table: .github/release-gates.yml
# Spec: docs/for-developers/specs/2026-05-22-release-gate-spreadsheet.md (issue #1016)

on:
  pull_request:
    branches:
      - main-staging
      - main
    types: [opened, synchronize, reopened]
  # #4937: re-classify when CI finishes on a release head. `check_suite` (used before) never fires
  # for check suites created by GitHub Actions — i.e. for all of our CI — so the bot only ran at PR
  # open/push, before any job had finished, and posted "✅ No failed checks" on a red head.
  # The list is every workflow seen on the heads of release PRs #4892 and #4897
  # (`gh run list --commit <sha> --json workflowName`); names must match `name:` exactly.
  workflow_run:
    workflows:
      - "CI"
      - "Backend E2E Tests"
      - "E2E Tests"
      - "Branch Policy"
      - "Staging Gate"
      - "Prod Gate"
      - "API Smoke (Bruno) — PR main-staging → main (prod promotion)"
      - "Security Scan"
      - "Performance Tests"
      - "Security Penetration Tests"
      - "Docs Link Check"
      - "E2E Cover R2-strict"
      - "E2E PDF upload su S3"
      - "Prometheus Rules Gate"
      - "Backend Missing Gate"
      - "Validate Workflows"
      - "Validate Workflow Cache Patterns"
      - "Seed Snapshot Bake (CI smoke — ci.yml manifest)"
    types: [completed]
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to classify (manual dispatch)"
        required: true
        type: string

# Concurrency: key on the head SHA, for pull_request and workflow_run alike. Several workflows
# finish within seconds of each other on the same commit, and the PR-open run may still be going:
# they must share one slot, so `cancel-in-progress: true` eliminates the TOCTOU race before two
# `createComment` calls can fire. The last run reads every check-run, so cancelling earlier ones
# loses nothing.
concurrency:
  group: release-gate-comment-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.event.inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  issues: write
  # Phase 2a (#1444): `checks: write` is needed by publishVerdict() to create
  # the synthesized 'Release-Gate Verdict' check-run on the PR head SHA.
  # Phase 1 only needed `checks: read` for listForRef().
  checks: write
  contents: read

jobs:
  classify:
    name: Classify release-PR failures
    runs-on: ubuntu-latest
    # Restrict to release PRs (main-staging / main target) + manual dispatch. workflow_run is already
    # filtered to `release/**` heads by `on.workflow_run.branches`.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_run' ||
      (github.event_name == 'pull_request' && (github.base_ref == 'main-staging' || github.base_ref == 'main'))
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d  # v4
        with:
          version: 9

      - name: Install release-gate deps
        working-directory: scripts/release-gate
        run: pnpm install --frozen-lockfile

      - name: Validate .github/release-gates.yml schema
        working-directory: scripts/release-gate
        run: node validate.mjs

      - name: Resolve PR number
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_PR_EVENT: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA_PR_EVENT: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER_DISPATCH: ${{ github.event.inputs.pr_number }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              echo "pr_number=$PR_NUMBER_PR_EVENT" >> "$GITHUB_OUTPUT"
              echo "head_sha=$PR_HEAD_SHA_PR_EVENT" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              # Validate dispatched PR number is a positive integer before using in API path.
              # Without this guard, `gh api repos/.../pulls/$PR_NUMBER_DISPATCH` could be
              # tricked into resolving an unintended path (e.g. "1234/../../...") on the
              # GitHub API surface, given the bot token has pull-requests:write.
              if ! [[ "$PR_NUMBER_DISPATCH" =~ ^[0-9]+$ ]]; then
                echo "::error::pr_number must be a positive integer, got: $PR_NUMBER_DISPATCH"
                exit 1
              fi
              echo "pr_number=$PR_NUMBER_DISPATCH" >> "$GITHUB_OUTPUT"
              # Resolve head SHA for the dispatched PR
              SHA=$(gh api "repos/$REPO_SLUG/pulls/$PR_NUMBER_DISPATCH" --jq '.head.sha')
              echo "head_sha=$SHA" >> "$GITHUB_OUTPUT"
              ;;
            workflow_run)
              # Look up the open release PR whose head is the commit this workflow ran on.
              # If none, skip gracefully (a release/** branch without a release PR).
              PR_NUM=$(gh api "repos/$REPO_SLUG/commits/$WORKFLOW_RUN_HEAD_SHA/pulls" \
                --jq '.[] | select(.state == "open" and (.base.ref == "main-staging" or .base.ref == "main")) | .number' \
                | head -n1 || echo "")
              if [ -z "$PR_NUM" ]; then
                echo "No open release PR associated with $WORKFLOW_RUN_HEAD_SHA — skipping."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # A workflow that finished on an older commit must not overwrite the comment of the
              # current head with stale check-runs.
              CURRENT=$(gh api "repos/$REPO_SLUG/pulls/$PR_NUM" --jq '.head.sha')
              if [ "$CURRENT" != "$WORKFLOW_RUN_HEAD_SHA" ]; then
                echo "PR #$PR_NUM head is $CURRENT, not $WORKFLOW_RUN_HEAD_SHA — skipping."
                echo "skip=true" >> "$GITHUB_OUTPUT"
              else
                echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
                echo "head_sha=$WORKFLOW_RUN_HEAD_SHA" >> "$GITHUB_OUTPUT"
              fi
              ;;
          esac

      - name: Classify and post/edit comment
        id: classify
        if: steps.pr.outputs.skip != 'true'
        working-directory: scripts/release-gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Not GITHUB_SHA: GITHUB_* variables cannot be overwritten, so the script used to read the
          # check-runs of the commit this workflow runs on instead of the release head (#4937).
          RELEASE_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          # GITHUB_STEP_SUMMARY is set by GH Actions automatically.
        run: node comment.mjs
        # IMPORTANT: continue-on-error means the workflow does NOT fail when the
        # bot crashes — the fallback comment posted by comment.mjs is the visible
        # signal (AC-5). The spec mentions "neutral conclusion", but GitHub
        # Actions does not expose `neutral` at the job level for normal `run:`
        # steps; the closest behavior is `continue-on-error: true` which yields
        # `success` on the job summary while still posting the fallback comment
        # via the bot script itself. Branch protection must NOT include this
        # workflow as a required status check until a future PR adds a custom
        # check-run that explicitly sets `conclusion=neutral` via the Checks API.
        continue-on-error: true
