<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>House Rule Drawer · §F — MeepleAI SP6</title>
<!--
  Mockup: sp6-libro-game-house-rule
  Route:  bottom-sheet drawer dentro /gamebook/[gameId]/play (NO route propria)
  Pattern: drawer tabbed bottom-sheet mobile / side-panel desktop 380px
  Brief:  SP6-libro-game-amended-for-mockup6.md §F (post-#2045)
  13 stati canonici × 2 temi (light/dark) × 2 viewport (375 mobile / 1440 desktop).
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<style>
  /* ─── Per-frame theme override ───────────────────────────────────────────
     tokens.css scopes theme vars su :root[data-theme]; per renderizzare frame
     light E dark sulla STESSA pagina ri-scopo i token sull'attributo
     [data-theme] (specificità inferiore a :root[...], così <html> resta
     governato globalmente, mentre i frame nidificati si auto-temano). */
  [data-theme="light"] {
    --bg: #f7f3ee; --bg-card: #ffffff; --bg-muted: #efe6d9; --bg-sunken: #ede2d0;
    --bg-hover: rgba(180,130,80,0.06);
    --text: #2b1f12; --text-sec: #5a4a38; --text-muted: #9a8870;
    --border: rgba(180,130,80,0.18); --border-light: rgba(180,130,80,0.1); --border-strong: rgba(180,130,80,0.32);
    --shadow-xs: 0 1px 2px rgba(90,60,20,0.06); --shadow-sm: 0 2px 8px rgba(90,60,20,0.08);
    --shadow-md: 0 4px 16px rgba(90,60,20,0.1); --shadow-lg: 0 12px 36px rgba(90,60,20,0.14);
    --shadow-drawer: 0 -8px 32px rgba(90,60,20,0.12);
    --glass-bg: rgba(255,255,255,0.88); --glass-border: rgba(255,255,255,0.6);
    --c-game: 25 95% 45%; --c-player: 262 83% 58%; --c-session: 240 60% 55%; --c-agent: 38 92% 50%;
    --c-kb: 174 60% 40%; --c-chat: 220 80% 55%; --c-event: 350 89% 60%; --c-toolkit: 142 70% 45%; --c-tool: 195 80% 50%;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #14100a; --bg-card: #1e1710; --bg-muted: #241c13; --bg-sunken: #0f0c08;
    --bg-hover: rgba(255,200,130,0.05);
    --text: #f0e4d2; --text-sec: #c8b896; --text-muted: #8a7860;
    --border: rgba(224,180,110,0.14); --border-light: rgba(224,180,110,0.08); --border-strong: rgba(224,180,110,0.28);
    --shadow-xs: 0 1px 2px rgba(0,0,0,0.3); --shadow-sm: 0 2px 8px rgba(0,0,0,0.4);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.5); --shadow-lg: 0 12px 36px rgba(0,0,0,0.6);
    --shadow-drawer: 0 -8px 32px rgba(0,0,0,0.5);
    --glass-bg: rgba(30,22,14,0.85); --glass-border: rgba(224,180,110,0.14);
    --c-game: 28 95% 58%; --c-player: 262 75% 70%; --c-session: 235 70% 70%; --c-agent: 38 92% 62%;
    --c-kb: 174 60% 55%; --c-chat: 218 80% 68%; --c-event: 350 85% 70%; --c-toolkit: 142 60% 58%; --c-tool: 195 75% 62%;
    color-scheme: dark;
  }

  /* ─── Scaffold ─── */
  body { background: var(--bg); color: var(--text); font-family: var(--f-body); margin: 0; }

  .hr-nav {
    position: sticky; top: 0; z-index: var(--z-nav);
    display: flex; align-items: center; gap: var(--s-4);
    padding: var(--s-3) var(--s-6); flex-wrap: wrap;
    backdrop-filter: blur(12px); background: var(--glass-bg);
    border-bottom: 1px solid var(--border);
  }
  .hr-brand { font-family: var(--f-display); font-weight: var(--fw-bold); font-size: var(--fs-md); display: flex; align-items: center; gap: var(--s-2); }
  .hr-mark { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: var(--r-sm); background: hsl(var(--c-game)); color: #fff; font-weight: var(--fw-ext); }
  .hr-links { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
  .hr-links a {
    width: 26px; height: 26px; border-radius: var(--r-sm);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--f-mono); font-size: var(--fs-xs); font-weight: var(--fw-bold);
    background: var(--bg-muted); color: var(--text-sec);
    transition: background var(--dur-sm) var(--ease-out), color var(--dur-sm) var(--ease-out);
  }
  .hr-links a:hover { background: hsl(var(--c-agent) / 0.15); color: hsl(var(--c-agent)); }
  .hr-toggle {
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
    border-radius: var(--r-pill); padding: var(--s-1) var(--s-3);
    font-family: var(--f-mono); font-size: var(--fs-xs); font-weight: var(--fw-bold); cursor: pointer;
  }

  .hr-hero { max-width: 1700px; margin: 0 auto; padding: var(--s-8) var(--s-6) var(--s-4); }
  .hr-hero h1 { font-family: var(--f-display); font-size: var(--fs-3xl); font-weight: var(--fw-ext); margin: 0 0 var(--s-3); }
  .hr-hero p { color: var(--text-sec); font-size: var(--fs-md); line-height: var(--lh-body); max-width: 920px; margin: 0 0 var(--s-2); }
  .hr-hero code { font-family: var(--f-mono); background: var(--bg-muted); padding: 1px 6px; border-radius: var(--r-xs); font-size: 0.9em; }
  .hr-hero .hr-note { font-size: var(--fs-sm); color: var(--text-muted); border-left: 2px solid hsl(var(--c-agent) / 0.4); padding-left: var(--s-3); }

  .hr-stage { max-width: 1700px; margin: 0 auto; padding: var(--s-6) var(--s-6) var(--s-10); }
  .state-section { margin-bottom: var(--s-10); scroll-margin-top: 80px; }
  .sec-head { margin-bottom: var(--s-5); }
  .sec-label {
    display: inline-block; padding: var(--s-1) var(--s-3);
    background: hsl(var(--c-agent) / 0.12); color: hsl(var(--c-agent));
    border-radius: var(--r-pill); font-family: var(--f-mono); font-size: var(--fs-xs);
    font-weight: var(--fw-bold); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: var(--s-2);
  }
  .sec-head h2 { font-family: var(--f-display); font-size: var(--fs-2xl); font-weight: var(--fw-bold); margin: 0 0 var(--s-2); }
  .sec-desc { color: var(--text-sec); font-size: var(--fs-md); line-height: var(--lh-body); max-width: 920px; margin: 0; }

  .matrix { display: flex; gap: var(--s-9); flex-wrap: wrap; align-items: flex-start; }
  .frame-wrap { display: flex; flex-direction: column; gap: var(--s-2); }
  .frame-cap { font-family: var(--f-mono); font-size: var(--fs-xs); color: var(--text-muted); font-weight: var(--fw-bold); text-transform: uppercase; letter-spacing: 0.06em; }

  /* phone device */
  .device-phone {
    width: 375px; height: 720px; border-radius: 36px; overflow: hidden;
    border: 1px solid var(--border-strong); box-shadow: var(--shadow-lg);
    display: flex; flex-direction: column; background: var(--bg); position: relative;
  }
  .phone-sbar { height: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 4px 22px 0; font-size: 12px; font-weight: var(--fw-bold); font-family: var(--f-display); color: var(--text-sec); }

  /* desktop device */
  .device-desktop {
    width: 940px; height: 560px; border-radius: var(--r-lg); overflow: hidden;
    border: 1px solid var(--border-strong); box-shadow: var(--shadow-lg);
    display: flex; flex-direction: column; background: var(--bg); position: relative;
  }
  .win-bar { height: 30px; background: var(--bg-muted); flex-shrink: 0; display: flex; align-items: center; padding: 0 var(--s-3); gap: 6px; border-bottom: 1px solid var(--border-light); }
  .win-bar .dot { width: 10px; height: 10px; border-radius: 50%; }
  .win-bar .dot.r { background: #ff605c; } .win-bar .dot.y { background: #ffbd44; } .win-bar .dot.g { background: #00ca4e; }
  .win-url { margin-left: var(--s-3); padding: 2px var(--s-3); background: var(--bg-card); border-radius: var(--r-sm); font-family: var(--f-mono); font-size: 11px; color: var(--text-muted); flex: 1; }

  .hr-foot { max-width: 1700px; margin: 0 auto; padding: var(--s-6) var(--s-6) var(--s-9); font-family: var(--f-mono); font-size: var(--fs-xs); color: var(--text-muted); border-top: 1px solid var(--border-light); }

  /* ─── Animations ─── */
  .hr-spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff;
    display: inline-block; animation: hr-spin 0.7s linear infinite;
  }
  @keyframes hr-spin { to { transform: rotate(360deg); } }
  .hr-toast { animation: hr-toast-in var(--dur-md) var(--ease-out); }
  @keyframes hr-toast-in { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  /* state-05 highlight border fade (600-2600ms) — applicato alla rule evidenziata */
  @keyframes hr-highlight-fade { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* prefers-reduced-motion: snap istantaneo (no spin loop visivo, no slide, no fade) */
  @media (prefers-reduced-motion: reduce) {
    .hr-spinner { animation: none; }
    .hr-toast { animation: none; }
    *, *::before, *::after { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script>
    // Theme init (persisted, scaffold chrome only — i frame si auto-temano)
    (function () {
      var t = null;
      try { t = localStorage.getItem('mai-theme'); } catch (e) {}
      document.documentElement.setAttribute('data-theme', t || 'light');
    })();

    // AC — contrast check (console.assert AA ≥ 4.5 su testo primario, light + dark)
    window.addEventListener('load', function () {
      function lum(rgb) {
        var c = rgb.map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
        return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
      }
      function ratio(a, b) { var L1 = lum(a), L2 = lum(b); var hi = Math.max(L1, L2), lo = Math.min(L1, L2); return (hi + 0.05) / (lo + 0.05); }
      function parse(str) { var m = str.match(/\d+(\.\d+)?/g); return m ? m.slice(0, 3).map(Number) : [0, 0, 0]; }
      function probe(theme) {
        var el = document.createElement('div');
        el.setAttribute('data-theme', theme);
        el.style.cssText = 'position:absolute;left:-9999px;background:var(--bg-card);color:var(--text);';
        document.body.appendChild(el);
        var cs = getComputedStyle(el);
        var r = ratio(parse(cs.color), parse(cs.backgroundColor));
        document.body.removeChild(el);
        console.assert(r >= 4.5, 'Contrast --text/--bg-card ' + theme + ' = ' + r.toFixed(2) + ' (< 4.5 AA)');
        console.log('[a11y] contrast --text/--bg-card ' + theme + ' = ' + r.toFixed(2));
      }
      probe('light'); probe('dark');
    });
  </script>

  <script type="text/babel" data-presets="react" src="sp6-libro-game-house-rule.jsx"></script>
</body>
</html>
