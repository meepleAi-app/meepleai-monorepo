name: Provision MediatR licence on staging

# #3998 — perche' questo workflow esiste.
#
# I `.secret` su staging si modificano SOLO via SSH diretto: `infra/scripts/sync-secrets.sh`
# fa `scp "$REMOTE:…*.secret" "$SECRETS_DIR/"`, cioe' **staging → locale**, e
# `deploy-staging.yml` si limita a `source` dei file gia' presenti. Staging e' la source of
# truth e nessuna pipeline li scrive, quindi finora provisionare un secret opzionale
# richiedeva che una persona avesse accesso SSH dalla propria rete.
#
# Il runner, che ha `STAGING_HOST`/`STAGING_USER`/`STAGING_SSH_KEY`, raggiunge l'host anche
# quando una rete esterna non lo fa: lo stesso meccanismo di `admin-reset.yml`, `rollback.yml`
# e del deploy.
#
# La licenza arriva da un **secret del repository** e non da un input: gli input di
# `workflow_dispatch` compaiono in chiaro nell'interfaccia e nei log, i secret vengono
# mascherati. (Per confronto, `admin-reset.yml` prende la password come input `type: string`:
# e' un difetto a se', non replicato qui.)
#
# Il workflow NON riavvia l'API: la licenza viene letta all'avvio
# (`Program.cs` → `cfg.LicenseKey`), quindi si applica al prossimo restart o deploy. Restare
# fuori dal ciclo di vita dei container e' deliberato — scrivere un file e riavviare un
# servizio sono due decisioni diverse e la seconda non e' implicita nella prima.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Scrivi "yes" per confermare la scrittura su staging'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    name: Scrive mediatr.secret su staging
    runs-on: ${{ vars.RUNNER && fromJSON(vars.RUNNER) || 'ubuntu-latest' }}
    if: vars.DEPLOY_METHOD == 'ssh'
    steps:
      - name: Valida la conferma
        run: |
          if [ "${{ inputs.confirm }}" != "yes" ]; then
            echo "::error::Conferma richiesta: scrivi 'yes' per procedere"
            exit 1
          fi
          echo "Confermato"

      - name: Verifica che il secret sia configurato
        env:
          MEDIATR_LICENSE_KEY: ${{ secrets.MEDIATR_LICENSE_KEY }}
        run: |
          # Fallire QUI e non sul server: senza questo controllo il passo SSH scriverebbe una
          # riga vuota, e una licenza vuota e' indistinguibile da «nessuna licenza» — che e'
          # il comportamento di default, quindi il fallimento passerebbe per successo.
          if [ -z "${MEDIATR_LICENSE_KEY}" ]; then
            echo "::error::Il secret MEDIATR_LICENSE_KEY non e' configurato nel repository"
            exit 1
          fi
          echo "Il secret c'e': ${#MEDIATR_LICENSE_KEY} caratteri"

      - name: Scrive mediatr.secret via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        env:
          MEDIATR_LICENSE_KEY: ${{ secrets.MEDIATR_LICENSE_KEY }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: MEDIATR_LICENSE_KEY
          script: |
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
            set -e

            SECRET_FILE="/opt/meepleai/repo/infra/secrets/mediatr.secret"

            if [ ! -f "$SECRET_FILE" ]; then
              echo "::error::$SECRET_FILE non esiste — staging non e' nello stato atteso"
              exit 1
            fi

            # Backup prima di toccarlo: e' la source of truth dei secret, e un file di secret
            # sovrascritto male non si recupera da nessun repository.
            cp "$SECRET_FILE" "${SECRET_FILE}.bak.$(date +%Y%m%d%H%M%S)"

            # Riscrive la sola riga della chiave, conservando i commenti del file. Il
            # delimitatore e' `|` perche' la chiave e' un JWT e contiene `/` e `+`; non
            # contiene `|`. `awk` invece di `sed` per non dover escapare il valore.
            # `if (!found)` dentro il match: scrive alla PRIMA occorrenza e scarta le
            # successive. Senza quel guard, un file con due righe della chiave ne avrebbe
            # ottenute due riscritte — e in un `env_file` un duplicato significa che vince
            # l'ultimo, cioe' un esito che dipende dall'ordine.
            awk -v key="$MEDIATR_LICENSE_KEY" '
              /^MEDIATR_LICENSE_KEY=/ {
                if (!found) { print "MEDIATR_LICENSE_KEY=" key; found=1 }
                next
              }
              { print }
              END { if (!found) print "MEDIATR_LICENSE_KEY=" key }
            ' "$SECRET_FILE" > "${SECRET_FILE}.new"

            mv "${SECRET_FILE}.new" "$SECRET_FILE"
            chmod 600 "$SECRET_FILE"

            # Verifica senza esporre nemmeno un frammento della chiave: la sola lunghezza
            # distingue «scritta» da «vuota», e il case distingue «scritta» da «ancora il
            # placeholder». Niente prefissi, niente `head -c`.
            WRITTEN=$(grep '^MEDIATR_LICENSE_KEY=' "$SECRET_FILE" | head -1 | cut -d= -f2-)
            if [ -z "$WRITTEN" ]; then
              echo "::error::la riga e' vuota dopo la scrittura"
              exit 1
            fi
            case "$WRITTEN" in
              your_*|*_here) echo "::error::e' ancora il placeholder"; exit 1 ;;
            esac

            # E una riga sola: un duplicato in un env_file fa vincere l'ultimo.
            COUNT=$(grep -c '^MEDIATR_LICENSE_KEY=' "$SECRET_FILE")
            if [ "$COUNT" != "1" ]; then
              echo "::error::attese 1 riga MEDIATR_LICENSE_KEY=, trovate $COUNT"
              exit 1
            fi

            echo "mediatr.secret scritto: ${#WRITTEN} caratteri, 1 riga"
            echo "Si applica al prossimo restart dell'API: questo workflow non riavvia niente."
