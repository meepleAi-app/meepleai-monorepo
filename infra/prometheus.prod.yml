# OPS-02: Prometheus Configuration — PRODUCTION
# Auto-generated from prometheus.yml with production-specific external_labels.
# Mount via compose.prod.yml: ./prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    cluster: 'meepleai-prod'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      timeout: 10s
      api_version: v2

rule_files:
  - '/etc/prometheus/prometheus-rules.yml'
  # Issue #2470 — Wikidata SSE plane starvation alerts.
  - '/etc/prometheus/wikidata-sse.yml'
  # Issue #3117 — Wikidata enrichment pipeline-health alerts (dead-letter / queue depth).
  - '/etc/prometheus/wikidata-enrichment.yml'
  # Issue #3082 — BGG ToS-compliance SLO=0 alert (any nonzero render attempt = P1).
  - '/etc/prometheus/bgg-tos-compliance.yml'
  # Issue #3786 — degradazione silenziosa del braccio vettoriale (failed vs empty).
  - '/etc/prometheus/rag-vector-arm.yml'
  # #3495 M2 — SSRF egress guard (private_ip = P1) + #3583 policy alert (denylist_hit = warning).
  # Il file era già montato ma mai referenziato in staging/prod: regole caricate solo da #3583.
  - '/etc/prometheus/egress-guard.yml'
  # #3373 D4 / #3383 — tripwire single-pod: count(up{job="meepleai-api"}) > 1.
  # Il file esisteva dal #3373 ma non era montato ne' referenziato in ALCUN ambiente,
  # quindi l'alert non e' mai stato attivo: era il presupposto dichiarato di ADR-087 D4.
  - '/etc/prometheus/api-single-instance.yml'
  # Issue #3112 — OPS-02 Slack delivery observability alerts.
  - '/etc/prometheus/slack-delivery.yml'
  # Issue #3116 — SP5 Admin Security audit_outbox health alerts.
  - '/etc/prometheus/audit-outbox.yml'
  # Issue #1965 — domain_event_outbox duplicate-publish trigger (dormant until API >=2 replicas).
  - '/etc/prometheus/domain-event-outbox-duplicate-publish.yml'
  # Issue #3248 (epic #448 C5) — copyright enforcement observability alerts.
  - '/etc/prometheus/copyright-enforcement.yml'
  # Issue #3390 (epic #3397) Slice 1 — in-session agent grounding observability (ungrounded-rate on RAG live path).
  - '/etc/prometheus/agent-grounding.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  - job_name: 'meepleai-api'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8080']
        labels:
          service: 'meepleai-api'
          component: 'backend'

  - job_name: 'meepleai-web'
    scrape_interval: 15s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['web:3000']
        labels:
          service: 'meepleai-web'
          component: 'frontend'

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'
          component: 'visualization'

  # ---------------------------------------------------------------------------
  # AI/ML Services (profile: ai)
  # ---------------------------------------------------------------------------

  - job_name: 'embedding-service'
    scrape_interval: 15s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['embedding-service:8000']
        labels:
          service: 'embedding-service'
          component: 'ml'
          profile: 'ai'

  - job_name: 'unstructured-service'
    scrape_interval: 15s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['unstructured-service:8001']
        labels:
          service: 'unstructured-service'
          component: 'ingestion'
          profile: 'ai'

  - job_name: 'smoldocling-service'
    scrape_interval: 15s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['smoldocling-service:8002']
        labels:
          service: 'smoldocling-service'
          component: 'ingestion'
          profile: 'ai'

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          service: 'alertmanager'
          component: 'alerting'

  - job_name: 'cadvisor'
    scrape_interval: 30s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
          component: 'container-metrics'

  - job_name: 'node-exporter'
    scrape_interval: 30s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          component: 'host-metrics'

  # Traefik scrape job removed (PR #738 cutover to CF Tunnel — no traefik service to scrape).
