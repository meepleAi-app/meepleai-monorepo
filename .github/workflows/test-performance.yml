name: Performance Tests

# Consolidated performance testing: K6 load tests + Lighthouse CI
# Issue #2286: Workflow re-enabled after modernization
# Issue #2928: Extended with all API load test scenarios

on:
  schedule:
    # K6: Run nightly at 2 AM UTC (only on main branch)
    - cron: '0 2 * * *'
  pull_request:
    # Issue #1587: dropped main-staging from branches. Release PRs (main-dev →
    # main-staging) no longer trigger Performance Tests because the deploy-staging
    # workflow already runs `Snapshot Performance Baseline` + `Compare Performance
    # Baseline` post-deploy on the live staging environment. Running perf on the
    # release PR was redundant AND held the single self-hosted runner — when a
    # post-step log-upload hung (split-brain GHA token expiry), it starved the
    # Deploy to Staging job that needed the same runner (incident 2026-05-26).
    # Perf on PRs to main (production release) is preserved.
    #
    # #4978: PRs to main-dev run K6 too, but only when they change this workflow or tests/k6 (the `k6_self`
    # filter of Detect Changes). Until then nothing ran this workflow when its own code changed, and it stayed
    # red on the release PRs for causes that had nothing to do with the release.
    branches: [main, main-dev]
    paths:
      - 'apps/web/**'
      - 'apps/api/src/Api/Routing/**'
      - 'apps/api/src/Api/BoundedContexts/**'
      - 'tests/k6/**'
      - '.github/workflows/test-performance.yml'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'K6 test type'
        required: false
        default: 'smoke'
        type: choice
        options:
          - smoke
          - load
          - stress
      k6_scenario:
        description: 'K6 scenario to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - admin-polling
          - user-dashboard
          - library-browsing
          - catalog-search
          - admin-concurrent
          - rag-isolated
          - rag-e2e
      run_lighthouse:
        description: 'Run Lighthouse CI'
        required: false
        default: true
        type: boolean
      run_k6:
        description: 'Run K6 tests'
        required: false
        default: true
        type: boolean
      notify_on_failure:
        description: 'Open or comment the "Performance Tests Failed" issue if the run fails, as the nightly run does (#4978)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: write

concurrency:
  group: test-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  API_BASE_URL: http://localhost:8080
  TEST_GAME_ID: '00000000-0000-0000-0000-000000000001'
  POSTGRES_USER: 'postgres'
  POSTGRES_PASSWORD: 'testpass123'
  POSTGRES_DB: 'meepleai_test'

jobs:
  changes:
    name: Detect Changes
    runs-on: ${{ vars.RUNNER && fromJSON(vars.RUNNER) || 'ubuntu-latest' }}
    # Issue #1587: explicit timeout so this self-hosted job (checkout +
    # paths-filter) can never tie up the single runner in a stuck teardown.
    # Completes the "timeout on every perf job" coverage started in #1594
    # (which pinned lighthouse-* and added their timeouts).
    timeout-minutes: 10
    outputs:
      web: ${{ steps.filter.outputs.web || 'true' }}
      api: ${{ steps.filter.outputs.api || 'true' }}
      k6: ${{ steps.filter.outputs.k6 || 'true' }}
      k6_self: ${{ steps.filter.outputs.k6_self || 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            web:
              - 'apps/web/**'
            api:
              - 'apps/api/**'
            k6:
              - 'tests/k6/**'
            k6_self:
              - 'tests/k6/**'
              - '.github/workflows/test-performance.yml'

  # ============================================
  # K6 PERFORMANCE TESTS
  # ============================================
  k6-tests:
    name: K6 Performance Tests
    runs-on: ${{ vars.RUNNER && fromJSON(vars.RUNNER) || 'ubuntu-latest' }}
    needs: changes
    timeout-minutes: 45
    # #4978: only on PRs, where release-gates.yml classifies the check as a warning. On the nightly run and on a
    # dispatch a red K6 now makes the run red, so notify-failure can fire: with `true` everywhere the run was
    # `success` with K6 in `failure`, and the alert never went off.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    # #4978: `inputs.run_k6` is a boolean; the old `!= 'false'` compared it with a string, which is never equal
    # (false → 0, 'false' → NaN), so unticking the input did not skip the job.
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.run_k6) ||
      (github.event_name == 'schedule') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main' && (needs.changes.outputs.api == 'true' || needs.changes.outputs.k6 == 'true')) ||
      (github.event_name == 'pull_request' && github.base_ref == 'main-dev' && needs.changes.outputs.k6_self == 'true')

    services:
      postgres:
        image: pgvector/pgvector:pg16  # Issue #3547: Use pgvector image for Vector column support
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_PASSWORD: 'testpass123'
          POSTGRES_DB: meepleai_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    # Note: pgvector removed (Issue #4861) - vector search uses pgvector inside PostgreSQL.

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup backend environment
        uses: ./.github/actions/setup-backend
        with:
          dotnet-version: '10.0.x'
          working-directory: apps/api
          cache-nuget: 'true'

      # #4978: k6 from the release tarball, at a fixed version checked against its sha256, on amd64 and arm64
      # alike. The apt repository needed a GPG key, which changed between the nightly runs of 2026-11-09 and
      # 2026-11-10 (`NO_PUBKEY C780D0BDB1A69C86`, exit 100); the arm64 branch downloaded `latest`.
      # To upgrade: the sha256 values are in k6-<version>-checksums.txt of the release.
      - name: Install k6 and Redis CLI
        env:
          K6_VERSION: v2.3.0
          K6_SHA256_AMD64: 39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1
          K6_SHA256_ARM64: 5ca3433e8201da72a284aaa241a1bb5fb47f4abb4e384d39410ddd8062f49b90
        run: |
          case "$(dpkg --print-architecture)" in
            amd64) K6_ARCH=amd64; K6_SHA256="$K6_SHA256_AMD64" ;;
            arm64) K6_ARCH=arm64; K6_SHA256="$K6_SHA256_ARM64" ;;
            *) echo "::error::No k6 tarball for architecture $(dpkg --print-architecture)"; exit 1 ;;
          esac
          K6_DIR="k6-${K6_VERSION}-linux-${K6_ARCH}"
          curl -fsSL --retry 3 -o k6.tar.gz "https://github.com/grafana/k6/releases/download/${K6_VERSION}/${K6_DIR}.tar.gz"
          echo "${K6_SHA256}  k6.tar.gz" | sha256sum -c -
          tar xzf k6.tar.gz
          sudo install -m 0755 "${K6_DIR}/k6" /usr/local/bin/k6
          rm -rf k6.tar.gz "${K6_DIR}"
          k6 version
          sudo apt-get update && sudo apt-get install -y redis-tools postgresql-client

      - name: Clean API build outputs
        working-directory: apps/api/src/Api
        run: dotnet clean --configuration Release

      - name: Build API
        working-directory: apps/api/src/Api
        run: dotnet build --configuration Release --no-restore

      - name: Install EF Core tools
        run: |
          dotnet tool update --global dotnet-ef --version 10.* || dotnet tool install --global dotnet-ef --version 10.*
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Create test database
        run: |
          echo "Creating test database..."
          PGPASSWORD="testpass123" psql -h localhost -U "postgres" -d postgres <<-EOSQL
            SELECT 'CREATE DATABASE meepleai_test'
            WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'meepleai_test')\gexec
          EOSQL
          echo "Database ready"

      - name: Verify database connectivity
        run: |
          echo "Testing PostgreSQL connection..."
          PGPASSWORD="testpass123" psql -h localhost -U "postgres" -d postgres -c "SELECT version();"
          echo "Database connection successful"

      - name: Apply migrations
        working-directory: apps/api/src/Api
        run: dotnet ef database update --configuration Release

      # #4978: the load-test account. The API seeds it as its initial admin, and k6 logs in with it both as user
      # and as admin. Before, k6 used the defaults of tests/k6/utils/shared-config.js, which no seed creates: on
      # #4897 every login answered 400. The password is made here, since the database lives as long as the job.
      - name: Generate load-test credentials
        run: |
          password="K6-$(openssl rand -hex 16)-Ci1"
          echo "::add-mask::$password"
          {
            echo "K6_ADMIN_EMAIL=k6-admin@example.com"
            echo "K6_ADMIN_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Start API server
        working-directory: apps/api/src/Api
        run: |
          nohup dotnet run --configuration Release --environment CI > ../../../../api.log 2>&1 &
          echo $! > ../../../../api.pid
        env:
          # #4978: the Core seed layer creates the admin from these. SEED_PROFILE=Prod stops at that layer (admin
          # and AI models): the default for the CI environment is Dev, whose MechanicGolden layer needs an
          # embedding service the job does not have and fails after about 90 s of retries.
          INITIAL_ADMIN_EMAIL: ${{ env.K6_ADMIN_EMAIL }}
          INITIAL_ADMIN_PASSWORD: ${{ env.K6_ADMIN_PASSWORD }}
          SEED_PROFILE: 'Prod'
          DISABLE_RATE_LIMITING: 'true'
          ASPNETCORE_ENVIRONMENT: CI
          RateLimiting__MaxTokens__user: '999999'
          RateLimiting__RefillRate__user: '10000'
          RateLimiting__MaxTokens__anonymous: '999999'
          RateLimiting__RefillRate__anonymous: '10000'
          POSTGRES_USER: 'postgres'
          POSTGRES_PASSWORD: 'testpass123'
          POSTGRES_PASSWORD_FILE: ''
          POSTGRES_DB: 'meepleai_test'
          POSTGRES_HOST: 'localhost'
          POSTGRES_PORT: '5432'
          ConnectionStrings__Redis: 'localhost:6379'
          HealthChecks__Postgres__Enabled: 'false'
          OPENROUTER_API_KEY: 'sk-or-v1-dummy-key-for-ci-testing-only'
          ASPNETCORE_URLS: 'http://0.0.0.0:8080'

      - name: Wait for API to be ready
        run: |
          MAX_RETRIES=60
          RETRY=0
          BACKOFF=1

          echo "Waiting for API to be ready (max ${MAX_RETRIES} attempts)..."

          while [ $RETRY -lt $MAX_RETRIES ]; do
            if curl -f -s http://localhost:8080/health/live > /dev/null 2>&1; then
              echo "API is ready after $((RETRY + 1)) attempts"
              exit 0
            fi

            RETRY=$((RETRY + 1))
            echo "Waiting for API... ($RETRY/$MAX_RETRIES) - sleeping ${BACKOFF}s"
            sleep $BACKOFF

            if [ $BACKOFF -lt 5 ]; then
              BACKOFF=$((BACKOFF + 1))
            fi
          done

          echo "API failed to start after ${MAX_RETRIES} attempts"
          tail -n 100 api.log || echo "Could not read api.log"
          exit 1

      # #4978: one login before the scenarios. A wrong account used to show only as auth_errors inside each
      # scenario, swallowed by `|| true`; here it stops the job with the status the API returned.
      - name: Preflight login of the load-test account
        run: |
          payload=$(jq -n --arg email "$K6_ADMIN_EMAIL" --arg password "$K6_ADMIN_PASSWORD" '{email: $email, password: $password}')
          status=$(curl -s -o preflight-body.json -D preflight-headers.txt -w '%{http_code}' \
            -X POST "${API_BASE_URL}/api/v1/auth/login" -H 'Content-Type: application/json' -d "$payload")
          if [ "$status" != "200" ]; then
            echo "::error::Preflight login of ${K6_ADMIN_EMAIL} answered ${status}, not 200: $(head -c 300 preflight-body.json)"
            exit 1
          fi
          if ! grep -qi '^set-cookie: meepleai_session=' preflight-headers.txt; then
            echo "::error::Preflight login answered 200 without the meepleai_session cookie"
            exit 1
          fi
          rm -f preflight-body.json preflight-headers.txt
          echo "Preflight login of ${K6_ADMIN_EMAIL}: 200, with a session cookie"

      - name: Run k6 performance tests
        working-directory: tests/k6
        timeout-minutes: 30
        env:
          K6_TEST_TYPE: ${{ inputs.test_type || 'smoke' }}
          K6_SCENARIO: ${{ inputs.k6_scenario || 'all' }}
          TEST_USER_EMAIL: ${{ env.K6_ADMIN_EMAIL }}
          TEST_USER_PASSWORD: ${{ env.K6_ADMIN_PASSWORD }}
          TEST_ADMIN_EMAIL: ${{ env.K6_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ env.K6_ADMIN_PASSWORD }}
        run: |
          # Determine test type
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            TEST_TYPE="smoke"
            SCENARIO="all"
            echo "PR detected - running smoke tests for all scenarios"
          elif [ "${{ github.event_name }}" == "schedule" ]; then
            TEST_TYPE="smoke"
            SCENARIO="all"
            echo "Scheduled run - running smoke tests for all scenarios"
          else
            TEST_TYPE="${K6_TEST_TYPE}"
            SCENARIO="${K6_SCENARIO}"
            echo "Manual run - running ${TEST_TYPE} test for scenario: ${SCENARIO}"
          fi

          # #4978: the script keeps every scenario's exit code (no more `|| true`), fails if one is not 0, and
          # writes the duration of each scenario to the step summary. In smoke a scenario fails on auth_errors
          # and checks only; latency stays informative (thresholdsFor in utils/shared-config.js).
          bash utils/run-scenarios.sh "$TEST_TYPE" "$SCENARIO"

      # Issue #5542: Baseline regression gate
      - name: Run baseline regression check
        if: always()
        working-directory: tests/k6
        run: |
          chmod +x utils/baseline-compare.sh
          set +e
          utils/baseline-compare.sh reports
          rc=$?
          set -e
          # #4978: no summary means k6 produced nothing to compare, which used to pass as "no regression".
          if [ "$rc" -eq 3 ]; then
            echo "::error::No k6 summary in tests/k6/reports: the baseline check has nothing to compare"
            exit 1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "✅ Baseline regression check passed"
          else
            echo "❌ Baseline regression check failed — performance regression detected"
            # On PR, post the report as a comment
            if [ "${{ github.event_name }}" == "pull_request" ] && [ -f reports/baseline-comparison.md ]; then
              gh pr comment ${{ github.event.pull_request.number }} --body-file reports/baseline-comparison.md || true
            fi
            # Don't fail the workflow on smoke tests (informational only)
            if [ "${{ inputs.test_type || 'smoke' }}" != "smoke" ]; then
              exit 1
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Debug API logs on failure
        if: failure()
        run: |
          echo "========================================="
          echo "API Logs"
          echo "========================================="
          tail -n 200 api.log 2>/dev/null || echo "No API logs found"
          echo ""
          echo "========================================="
          echo "Health Check Status"
          echo "========================================="
          curl -v http://localhost:8080/health 2>&1 || echo "Health check failed"

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-performance-reports-${{ github.run_number }}
          path: tests/k6/reports/
          retention-days: 30

      - name: Archive API logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-api-logs-${{ github.run_number }}
          path: api.log
          retention-days: 7

      - name: Cleanup resources
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill $(cat api.pid) 2>/dev/null || true
            rm api.pid
          fi
          pkill -f "dotnet.*Api" 2>/dev/null || true
          redis-cli FLUSHALL 2>/dev/null || true
          echo "Cleanup complete"

  # ============================================
  # LIGHTHOUSE CI
  # ============================================
  lighthouse-build:
    name: Build Next.js (Lighthouse)
    # Issue #1587: pinned to ubuntu-latest (was: vars.RUNNER fallback). This
    # job is a pure Next.js production build — it doesn't touch staging and has
    # no reason to compete with deploy-staging for the single self-hosted runner.
    # timeout-minutes: 30 added so a hang (Node OOM, network stall) can't tie up
    # the runner indefinitely.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    # #4978: `inputs.run_lighthouse` is a boolean, as for run_k6 above. PRs to main-dev do not build for
    # Lighthouse yet: its artifact comes out empty, and the fix is the third PR of #4978.
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.run_lighthouse) ||
      (github.event_name == 'push') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main' && needs.changes.outputs.web == 'true')
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup frontend environment
        uses: ./.github/actions/setup-frontend
        with:
          pnpm-version: '10'
          working-directory: apps/web
          frozen-lockfile: 'true'

      - name: Setup Test Environment
        run: cp .env.test.example .env.test

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ hashFiles('apps/web/pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ hashFiles('apps/web/pnpm-lock.yaml') }}-
            ${{ runner.os }}-${{ runner.arch }}-nextjs-

      - name: Build Next.js for Production
        run: pnpm exec cross-env NODE_OPTIONS="--max-old-space-size=6144 --require ./scripts/dommatrix-polyfill.js" node ./node_modules/next/dist/bin/next build
        env:
          NODE_ENV: production

      - name: Upload Next.js Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-build-lighthouse-${{ github.sha }}
          path: |
            apps/web/.next/
            apps/web/.env.test
          retention-days: 1

  lighthouse-ci:
    name: Lighthouse CI
    # Issue #1587: pinned to ubuntu-latest + explicit timeout. Lighthouse autorun
    # operates on the build artifact served via lhci local server — no staging
    # dependency. Same rationale as lighthouse-build: no reason to share the
    # single self-hosted runner used by deploy-staging.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, lighthouse-build]
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup frontend environment
        uses: ./.github/actions/setup-frontend
        with:
          pnpm-version: '10'
          working-directory: apps/web
          frozen-lockfile: 'true'

      - name: Download Next.js Build
        uses: actions/download-artifact@v8
        with:
          name: nextjs-build-lighthouse-${{ github.sha }}
          path: apps/web

      - name: Run Lighthouse CI
        run: pnpm exec lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Upload Lighthouse CI Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-ci-results-${{ github.run_number }}
          path: apps/web/.lighthouseci/
          retention-days: 7

      - name: Extract Lighthouse Metrics
        id: lighthouse-metrics
        if: always()
        run: |
          echo "Extracting Lighthouse metrics from results..."
          METRICS_JSON="{}"

          # Find the manifest.json and extract metrics
          if [ -d ".lighthouseci" ]; then
            MANIFEST=$(find .lighthouseci -name "manifest.json" 2>/dev/null | head -1)
            if [ -n "$MANIFEST" ] && [ -f "$MANIFEST" ]; then
              # Parse manifest to get result files
              echo "Found manifest: $MANIFEST"

              # Create summary from lhr files
              SUMMARY=""
              for lhr in .lighthouseci/lhr-*.json; do
                if [ -f "$lhr" ]; then
                  URL=$(jq -r '.requestedUrl // .finalUrl' "$lhr" 2>/dev/null | sed 's|http://localhost:3000||')
                  PERF=$(jq -r '.categories.performance.score // 0' "$lhr" 2>/dev/null)
                  A11Y=$(jq -r '.categories.accessibility.score // 0' "$lhr" 2>/dev/null)
                  BP=$(jq -r '.categories["best-practices"].score // 0' "$lhr" 2>/dev/null)
                  SEO=$(jq -r '.categories.seo.score // 0' "$lhr" 2>/dev/null)
                  FCP=$(jq -r '.audits["first-contentful-paint"].numericValue // 0' "$lhr" 2>/dev/null)
                  LCP=$(jq -r '.audits["largest-contentful-paint"].numericValue // 0' "$lhr" 2>/dev/null)
                  TBT=$(jq -r '.audits["total-blocking-time"].numericValue // 0' "$lhr" 2>/dev/null)
                  CLS=$(jq -r '.audits["cumulative-layout-shift"].numericValue // 0' "$lhr" 2>/dev/null)

                  # Convert scores to percentages
                  PERF_PCT=$(echo "$PERF * 100" | bc 2>/dev/null || echo "0")
                  A11Y_PCT=$(echo "$A11Y * 100" | bc 2>/dev/null || echo "0")
                  BP_PCT=$(echo "$BP * 100" | bc 2>/dev/null || echo "0")
                  SEO_PCT=$(echo "$SEO * 100" | bc 2>/dev/null || echo "0")

                  # Format metrics
                  FCP_SEC=$(echo "scale=2; $FCP / 1000" | bc 2>/dev/null || echo "0")
                  LCP_SEC=$(echo "scale=2; $LCP / 1000" | bc 2>/dev/null || echo "0")
                  TBT_MS=$(printf "%.0f" "$TBT" 2>/dev/null || echo "0")
                  CLS_FMT=$(printf "%.3f" "$CLS" 2>/dev/null || echo "0")

                  SUMMARY="${SUMMARY}| ${URL:-/} | ${PERF_PCT%.*}% | ${A11Y_PCT%.*}% | ${FCP_SEC}s | ${LCP_SEC}s | ${TBT_MS}ms | ${CLS_FMT} |\n"
                fi
              done

              echo "summary<<EOF" >> $GITHUB_OUTPUT
              echo -e "$SUMMARY" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Comment PR with Performance Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const summary = `${{ steps.lighthouse-metrics.outputs.summary }}`;

            const comment = `## 🚀 Lighthouse CI Performance Report

            ### Core Web Vitals Budgets (Desktop)
            | Metric | Target | Status |
            |--------|--------|--------|
            | FCP (First Contentful Paint) | < 1.8s | ✅ |
            | LCP (Largest Contentful Paint) | < 2.5s | ✅ |
            | TBT (Total Blocking Time) | < 300ms | ✅ |
            | CLS (Cumulative Layout Shift) | < 0.1 | ✅ |

            ### Per-Page Results
            | Page | Perf | A11y | FCP | LCP | TBT | CLS |
            |------|------|------|-----|-----|-----|-----|
            ${summary || '| (No data available) | - | - | - | - | - | - |'}

            ### Category Score Targets
            - 🎯 Performance: ≥ 90%
            - ♿ Accessibility: ≥ 90%
            - ✅ Best Practices: ≥ 90%
            - 🔍 SEO: ≥ 80%

            ### Tested Pages (7 total)
            1. Admin Dashboard (\`/admin/dashboard\`)
            2. User Dashboard (\`/dashboard\`)
            3. Personal Library (\`/library\`)
            4. Shared Catalog (\`/shared-games\`)
            5. Profile & Settings (\`/settings\`)
            6. User Management (\`/admin/users\`)
            7. Editor Dashboard (\`/editor\`)

            📊 Full reports available in [workflow artifacts](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).
            `;

            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Lighthouse CI Performance Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  # ============================================
  # FAILURE NOTIFICATION
  # ============================================
  notify-failure:
    name: Notify on Failure
    runs-on: ${{ vars.RUNNER && fromJSON(vars.RUNNER) || 'ubuntu-latest' }}
    # Issue #1587: explicit timeout — completes the "every perf job" coverage.
    timeout-minutes: 10
    needs: [k6-tests, lighthouse-ci]
    # #4978: a dispatch with notify_on_failure fires it too, so the alert can be proved without waiting for a red
    # nightly run. It never fired before: K6 had `continue-on-error: true`, so the run was never a failure.
    if: failure() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.notify_on_failure))
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create GitHub issue on failure
        uses: actions/github-script@v8
        env:
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'Scheduled (nightly)' || 'Manual dispatch (notify_on_failure)' }}
        with:
          script: |
            const { RUN_ID, REF, TRIGGER } = process.env;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'performance,automated',
              per_page: 100
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.includes('Performance Tests Failed')
            );

            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${RUN_ID}`;
            const timestamp = new Date().toISOString();
            const branch = REF.replace('refs/heads/', '');

            const comment = `## Performance Test Failure - ${timestamp}

            **Run:** [#${RUN_ID}](${runUrl})
            **Branch:** ${branch}
            **Trigger:** ${TRIGGER}

            ### Action Required
            The performance tests have failed. Please investigate the workflow run for details.

            ### Common Issues to Check
            - [ ] API response times exceeding thresholds
            - [ ] Increased error rates
            - [ ] Database connection issues
            - [ ] Memory or resource constraints
            - [ ] Breaking changes in recent commits

            ### Next Steps
            1. Review the [workflow run](${runUrl}) logs
            2. Check the performance reports artifact
            3. Investigate and fix the root cause
            4. Re-run the workflow to verify the fix
            5. Close this issue once resolved`;

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: comment
              });
              console.log(`Added comment to existing issue #${existingIssue.number}`);
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Performance Tests Failed - Investigation Required',
                body: comment,
                labels: ['performance', 'automated', 'bug', 'priority-high']
              });
              console.log(`Created new issue #${issue.data.number}`);
            }
