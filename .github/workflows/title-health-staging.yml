name: Title-Health (staging extraction-quality regression guard)

# Epic #3338 WP3 — title-health regression guard, re-architected to run against STAGING.
#
# Why staging and not the CI seed snapshot: title-health measures the QUALITY of the section
# headings a game's chunks carry (text_chunks.Heading). The CI seed snapshot is baked with the
# Docnet extractor (plain text, zero Title structure) → headingless corpus → the metric has
# nothing to measure. Baking the snapshot with Unstructured (which produces headings) overruns the
# 6h GitHub-hosted job limit (~3x slower + one PDF stalls the poller). Staging, however, carries the
# real heading-aware re-indexed corpus (WP2), so the guard asserts against it.
#
# Mechanism: SSH into the staging server (it is inside the Cloudflare Access boundary and can reach
# the API on localhost), log in as the admin user (creds live in the server's admin.secret), and
# curl GET /api/v1/admin/kb/title-health. The JSON is compared on the runner against the committed
# baseline infra/fixtures/title-health-baseline.json by scripts/title-health-assert.sh --current-file.
#
# Runs weekly (schedule) in ASSERT mode, and can be dispatched manually to re-capture the baseline
# (update_baseline=true) after a staging re-index. Because the staging corpus is not version-pinned
# (unlike the seed snapshot), re-capture whenever a deliberate re-index changes headings — the guard
# still catches an unintended band DOWNGRADE / plausible-fraction drop between captures.

on:
  schedule:
    # Weekly, Wednesday 05:43 UTC. Off-peak + offset from the rag-smoke cron (Mon 05:37) and
    # top-of-hour (ADR-078: stay under the API/runner budget). Asserts only.
    - cron: '43 5 * * 3'
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'Capture/overwrite the title-health baseline from staging (instead of asserting)'
        required: false
        default: 'false'
        type: boolean

# ADR-078: monitor/probe workflows serialize per ref to stay under the API/runner budget.
concurrency:
  group: title-health-staging-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  title-health-staging:
    name: Title-health vs staging corpus
    runs-on: ubuntu-latest
    # Only where staging SSH deploy is configured (mirrors check-role-case.yml).
    if: vars.DEPLOY_METHOD == 'ssh'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch title-health from staging (SSH → admin login → GET endpoint)
        id: fetch
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          set -euo pipefail
          KEY=$(mktemp); printf '%s\n' "$STAGING_SSH_KEY" > "$KEY"; chmod 600 "$KEY"
          # Remote: SOURCE the admin creds (shell parsing strips inline `# comment`s correctly, unlike
          # grep|cut — mirrors check-role-case.yml sourcing database.secret), log in and ASSERT HTTP 200
          # (a bad login must fail loudly, not silently GET the endpoint unauthenticated), then GET the
          # admin-only endpoint. The JSON is wrapped in sentinels so a server MOTD / login banner on the
          # ssh stdout channel cannot pollute it — the runner extracts strictly between the markers.
          ssh -T -i "$KEY" -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            "${STAGING_USER}@${STAGING_HOST}" 'bash -s' > raw.out <<'REMOTE'
          set -euo pipefail
          set -a; . /opt/meepleai/repo/infra/secrets/admin.secret; set +a
          # The API runs in a container fronted by Traefik — localhost:8080 does NOT resolve on the
          # host (no port map), only INSIDE the api container. Run login + GET via `docker exec`
          # (curl is present in the image). Build the login body on the host and pass it in via -e.
          BODY=$(printf '{"email":"%s","password":"%s"}' "$ADMIN_EMAIL" "$ADMIN_PASSWORD")
          docker exec -e BODY="$BODY" meepleai-api sh -c '
            C=/tmp/th_cookie.$$
            lc=$(curl -sS -o /dev/null -w "%{http_code}" -c "$C" -X POST http://localhost:8080/api/v1/auth/login \
              -H "Content-Type: application/json" -d "$BODY")
            [ "$lc" = "200" ] || { echo "staging admin login failed (HTTP $lc)" >&2; rm -f "$C"; exit 1; }
            echo "===TH_JSON_BEGIN==="
            curl -sS -b "$C" http://localhost:8080/api/v1/admin/kb/title-health
            printf "\n===TH_JSON_END===\n"
            rm -f "$C"
          '
          REMOTE
          rm -f "$KEY"
          # Extract only the JSON between the sentinels (drops any MOTD/banner the channel prepended).
          sed -n '/^===TH_JSON_BEGIN===$/,/^===TH_JSON_END===$/p' raw.out | sed '1d;$d' > title-health.json
          # Fail loudly if the fetch produced no JSON array (SSH/auth/endpoint problem — remote stderr above).
          jq -e 'type == "array"' title-health.json >/dev/null 2>&1 \
            || { echo "::error:: staging title-health fetch returned no JSON array (see remote stderr): $(head -c 200 title-health.json)"; exit 1; }
          echo "games=$(jq 'length' title-health.json)" >> "$GITHUB_OUTPUT"
          echo "::notice:: fetched $(jq 'length' title-health.json) game(s) from staging"

      - name: Assert / capture title-health baseline
        id: guard
        run: |
          if [ "${{ github.event.inputs.update_baseline }}" = "true" ]; then
            bash infra/scripts/title-health-assert.sh --current-file="$PWD/title-health.json" --update-baseline
            echo "::notice:: title-health baseline updated — download the artifact and commit infra/fixtures/title-health-baseline.json"
          else
            bash infra/scripts/title-health-assert.sh --current-file="$PWD/title-health.json"
          fi

      - name: Upload updated title-health baseline (when --update-baseline)
        if: ${{ always() && github.event.inputs.update_baseline == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: title-health-baseline-${{ github.run_id }}
          path: infra/fixtures/title-health-baseline.json
          retention-days: 14

      - name: Open issue on title-health regression
        # always() is required: without a status function the implicit success() skips this after the
        # guard fails. Only fire on a real regression (guard failed) in assert mode.
        if: ${{ always() && steps.guard.outcome == 'failure' && github.event.inputs.update_baseline != 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'title-health-regression', state: 'open'
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `[TITLE-HEALTH] staging extraction-quality regression — ${new Date().toISOString().slice(0,10)}`,
                labels: ['bug', 'title-health-regression'],
                body: `A staging game's title-health band downgraded or its plausible-heading fraction dropped vs infra/fixtures/title-health-baseline.json (a chunking / extraction change buried section headings). See run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.\n\nIf a deliberate re-index changed the corpus, re-capture via workflow_dispatch (update_baseline=true) per docs/for-developers/operations/2026-07-28-wp3-title-health-go-no-go.md.`
              });
            }
