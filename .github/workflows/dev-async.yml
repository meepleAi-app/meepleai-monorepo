# Dev Async — non-blocking heavy checks on push to main-dev
#
# Per ADR-054 and epic #842 / issue #846: heavier integration + E2E suites
# run AFTER the merge to main-dev, not on the PR. Target SLO < 15 min.
# Failures here trigger the auto-revert bot (#843) once that lands; in the
# meantime, repeated red runs surface in the nightly digest (#850).
#
# This workflow does NOT gate PR merges. The hot path is dev-fast.yml.
name: Dev Async

on:
  push:
    branches: [main-dev]
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'apps/orchestration-service/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'global.json'
      - '.github/workflows/dev-async.yml'
      - '.github/actions/**'
  workflow_dispatch:

# `cancel-in-progress: false` NON accoda una fila. A gruppo occupato GitHub mette la nuova run
# pending e cancella la pending PRECEDENTE: la run in volo arriva quindi sempre in fondo, e quando
# lo slot si libera parte l'ultimo sha. È un debounce, non un backlog.
#
# Con `true`, un gate da ~83 minuti su un branch che riceve merge ogni 40-70 non aveva finestra: il
# 2026-08-17 nove run su quindici erano `cancelled`, e lo shard Games — l'ultimo a chiudere — non
# arrivava quasi mai in fondo. Un `cancelled` si legge come «annullato», non come «fallito»:
# `dev-auto-revert` lo classifica `green-pending` e non fa nulla, quindi su main-dev non esisteva
# alcun esito, né verde né rosso. È lo stesso difetto di #3629 su un altro asse.
concurrency:
  group: dev-async-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-26.04
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      orchestration: ${{ steps.filter.outputs.orchestration }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Issue #850: filter patterns must cover ALL paths that trigger
          # this workflow (see dev-fast.yml for rationale).
          filters: |
            frontend:
              - 'apps/web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/dev-async.yml'
              - '.github/actions/setup-frontend/**'
              - '.github/actions/setup-playwright/**'
            backend:
              - 'apps/api/**'
              - 'global.json'
              - '.github/workflows/dev-async.yml'
              - '.github/actions/setup-backend/**'
            orchestration:
              - 'apps/orchestration-service/**'

  # Issue #3629: questo job andava in timeout su 18 run su 20 e GitHub lo marcava `cancelled`.
  # Un `cancelled` si legge come «annullato», non come «fallito», quindi per settimane su main-dev
  # NON è esistito alcun esito per i ~3000 test Category=Integration — né verde né rosso — e i
  # [FAIL] reali nel log non hanno mai prodotto un segnale.
  #
  # La causa non era il timeout in sé: questo job divergeva da ci.yml su tutto ciò che rende gli
  # integration test eseguibili in tempi sani. Ogni fixture avviava Testcontainers da zero (ci.yml
  # passa TEST_POSTGRES_CONNSTRING / TEST_REDIS_CONNSTRING e SharedTestcontainersFixture li salta),
  # mancavano libgdiplus e i file secret, e non c'era sharding. Ora il percorso è lo stesso.
  backend-integration:
    name: Backend Integration (${{ matrix.shard.name }})
    runs-on: ubuntu-26.04
    # Il job sta SOPRA il TestSessionTimeout perché qui build Release, apt-get e setup sono dentro
    # il job, mentre ci.yml scarica un artifact già costruito. Con job a 50 e sessione a 45 il job
    # moriva prima — ai test restavano ~44 min — e si tornava a un `cancelled`.
    #
    # Il numero NON è una stima. Tre tentativi con soglie più basse hanno abortito ogni shard a
    # metà: 625/910, 423/1123, 558/929 a 30 min di job, e poi 2148/2962 complessivi a 45 min di
    # sessione. Il riferimento di PR #1505 («each shard runs ~29-30 min of real work») è da
    # scartare: veniva da ci.yml, che in quel periodo non eseguiva alcun test (#3632).
    #
    # Resta la RETE DI SICUREZZA: a scattare per primo dev'essere il TestSessionTimeout, perché
    # produce un riepilogo leggibile, mentre il timeout del job dà un `cancelled` muto — che è il
    # difetto da cui parte questa issue.
    #
    # #3634: 60 → 90, di pari passo con il TestSessionTimeout portato da 45 a 75 min. A 45 la
    # sessione veniva troncata: nel primo run che ha davvero eseguito i test, i tre shard si sono
    # fermati a ~44m30s con `Test Run Aborted.` lasciando ~800 test non raggiunti. 2148 test in 44
    # minuti danno ~61 minuti per l'intera selezione; 75 + 90 conserva il margine E l'ordine giusto
    # fra le due soglie.
    timeout-minutes: 110
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false  # uno shard rosso non deve nascondere l'esito degli altri
      matrix:
        # Stessa SELEZIONE di ci.yml, deliberatamente: se i due gate misurassero insiemi diversi,
        # un test potrebbe non essere eseguito da nessuno dei due — il difetto di #3622 su un altro
        # asse. La ripartizione invece qui e' piu' fine (#3742): cio' che ci.yml chiama `Games` e'
        # diviso in `Catalog` e `GamesAdmin`.
        #
        # Perche' divisa, e perche' li'. Uno shard dura quanto la sua catena seriale piu' lunga:
        # xUnit mette in parallelo le collection e in serie i test dentro una collection. In `Games`
        # la collection Integration-GroupC, con le classi di SharedGameCatalog e di GameManagement,
        # occupava il runner da sola dal ventesimo minuto alla fine: 59 minuti su un runner veloce,
        # e oltre i 75 del TestSessionTimeout su uno lento, dove ogni test dura circa il 45% in piu'
        # (tre run troncati su sette il 2026-10-13). Dividere lungo il confine fra i due contesti
        # spezza quella catena su due runner, senza spostare alcuna classe di collection: nessun
        # test comincia a girare in parallelo con uno con cui prima era in serie.
        #
        # `GamesAdmin` esclude SharedGameCatalog perche' i filtri sono per nome: una classe col nome
        # di entrambi i contesti girerebbe in tutti e due gli shard.
        #
        # 🔴 Le due meta' di questa regola non si tengono da sole. Togliere un token da uno shard
        # lasciandolo escluso da `Core` fa sparire quei test da OGNI shard, e nessun job cambia
        # colore. Lo verifica infra/scripts/tests/integration-shard-matrix.bats, insieme
        # all'uguaglianza con ci.yml e alla presenza di ogni shard nella baseline.
        shard:
          - name: "KnowledgeBase"
            filter_extra: "&(FullyQualifiedName~KnowledgeBase|FullyQualifiedName~DocumentProcessing|FullyQualifiedName~Authentication)"
          - name: "Catalog"
            filter_extra: "&(FullyQualifiedName~SharedGameCatalog)"
          - name: "GamesAdmin"
            filter_extra: "&(FullyQualifiedName~GameManagement|FullyQualifiedName~Administration)&FullyQualifiedName!~SharedGameCatalog"
          - name: "Core"
            filter_extra: "&FullyQualifiedName!~KnowledgeBase&FullyQualifiedName!~DocumentProcessing&FullyQualifiedName!~Authentication&FullyQualifiedName!~SharedGameCatalog&FullyQualifiedName!~GameManagement&FullyQualifiedName!~Administration"

    # Stessi service container di ci.yml: sostituiscono i Testcontainers avviati per-fixture, che
    # erano il vero costo.
    services:
      postgres:
        image: pgvector/pgvector:pg16  # Issue #3547: pgvector per le colonne Vector
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: meepleai_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --shm-size=256mb
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v6

      # libgdiplus: senza, i test che toccano il rendering PDF non falliscono subito ma dopo un
      # timeout, e il costo si somma su tutta la suite. È una delle differenze che rendevano questo
      # job molto più lento di ci.yml a parità di test.
      # `timeout-minutes` qui non e' pedanteria: il 2026-08-19 questo step si e' piantato per
      # 1h50m su un mirror apt, ha consumato l'intero budget del job e lo ha fatto uscire
      # `cancelled` — muto, senza che un solo test fosse partito. E' lo stesso difetto di #3629 su
      # un altro asse: un guasto che non lascia un esito leggibile. A 5 minuti fallisce presto e
      # dice perche'.
      - name: Install PDF Dependencies
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y libgdiplus redis-tools

      - uses: ./.github/actions/setup-backend
        with:
          dotnet-version: '10.0.x'
          working-directory: apps/api
          cache-version: ${{ vars.CACHE_VERSION || 'v1' }}

      - name: Build (Release)
        working-directory: apps/api
        run: dotnet build --no-restore --configuration Release

      # I service container sono dichiarati `healthy` da Docker prima di accettare davvero
      # connessioni applicative: attendere qui evita che i primi test paghino retry di connessione.
      - name: Wait for Services
        timeout-minutes: 3
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done
          until redis-cli -h localhost -p 6379 ping > /dev/null 2>&1; do sleep 1; done
          echo "postgres + redis ready"

      # Stessi file di ci.yml: senza, i percorsi che leggono i secret cadono su path di errore
      # lenti invece di partire configurati.
      - name: Create CI Secret Files
        run: |
          mkdir -p infra/secrets
          printf 'POSTGRES_USER=postgres\nPOSTGRES_PASSWORD=testpass\nPOSTGRES_DB=meepleai_test\n' > infra/secrets/database.secret
          printf 'REDIS_PASSWORD=redis-ci-test\n' > infra/secrets/redis.secret
          printf 'JWT_SECRET_KEY=ci-test-jwt-secret-key-minimum-32-chars-long\nJWT_ISSUER=meepleai-ci-test\nJWT_AUDIENCE=meepleai-ci-test\n' > infra/secrets/jwt.secret
          printf 'ADMIN_EMAIL=admin@test.local\nADMIN_PASSWORD=CiTestPassword123!\nADMIN_DISPLAY_NAME=CI Admin\nINITIAL_ADMIN_EMAIL=admin@test.local\nINITIAL_ADMIN_DISPLAY_NAME=CI Admin\n' > infra/secrets/admin.secret
          printf 'EMBEDDING_SERVICE_URL=http://localhost:8000\n' > infra/secrets/embedding-service.secret

      # #4298 — questo passo ESEGUE i test e NON decide il colore del job.
      #
      # Prima lo decideva: bastava un test fallito, compresi quelli dichiarati nella baseline, e il
      # job era rosso. Il confronto con la baseline girava dopo e scriveva «i FALLIMENTI sono
      # aumentati: 2 -> 9», ma su un job gia' rosso quell'errore non cambiava nulla che qualcuno
      # guardi. Sette test sono rimasti rossi oltre la baseline dal 2026-10-05 al 2026-10-12 cosi'
      # (#4280): il segnale c'era, a ogni run, e non era un segnale.
      #
      # Ora il passo conserva il codice d'uscita di `dotnet test` e lo passa al passo di guardia,
      # che e' l'unico a decidere: verde entro la baseline, rosso quando qualcosa e' cambiato.
      - name: Integration tests
        id: tests
        working-directory: apps/api
        env:
          # MaxPoolSize=2 + ClearAllPools() nel teardown: evita l'accumulo contro max_connections.
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=meepleai_test;Username=postgres;Password=testpass;MaxPoolSize=2;Timeout=30;Command Timeout=60
          # Queste due sono il punto: SharedTestcontainersFixture le legge e NON avvia i container.
          TEST_POSTGRES_CONNSTRING: Host=localhost;Port=5432;Database=meepleai_test;Username=postgres;Password=testpass;MaxPoolSize=2;Timeout=30;Command Timeout=60
          TEST_REDIS_CONNSTRING: localhost:6379,allowAdmin=true
          REDIS_URL: localhost:6379,allowAdmin=true
          OPENROUTER_API_KEY: test-key
          CI: true
          DISABLE_RATE_LIMITING: "true"  # Issue #3102: evita i 429 nei test di integrazione
          # Passate anche singolarmente come in ci.yml: alcuni percorsi le leggono direttamente
          # invece della connection string completa.
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: meepleai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        run: |
          # 🔴 Il codice d'uscita va CATTURATO, non lasciato alla pipeline. Senza `pipefail` lo
          # stato di `dotnet test | tee` e' quello di `tee`, sempre 0: e' giusto cosi', perche' qui
          # il passo non deve fallire — ma allora `${PIPESTATUS[0]}`, letto subito dopo, e' l'unico
          # posto dove il codice di `dotnet test` esiste ancora. Il passo di guardia lo confronta
          # col .trx: un'uscita diversa da 0 senza falliti nel .trx, o un codice che non e' ne' 0
          # ne' 1, fa fallire il job. `set +e` perche' il default di Actions e' `bash -e`.
          set +e
          # Target esplicito del .csproj (PR #1505): `dotnet test` sulla solution invocherebbe anche
          # Api.Analyzers.Tests.dll, che non ha test Category=Integration, e vstest tratta il
          # no-match su un assembly non vuoto come exit 1.
          #
          # Stesse esclusioni per nome di ci.yml, così i due gate misurano lo stesso insieme: una
          # divergenza qui riporterebbe il difetto di #3622 (test che nessun gate esegue) su un
          # altro asse.
          #
          # NESSUN override di TestSessionTimeout: valgono i 75 min del runsettings condiviso (#3634).
          dotnet test tests/Api.Tests/Api.Tests.csproj \
            --filter "Category=Integration&FullyQualifiedName!~UploadPdfMidPhaseCancellationTests&FullyQualifiedName!~FrontendSdk&FullyQualifiedName!~ArbitroAgent${{ matrix.shard.filter_extra }}" \
            --settings tests/Api.Tests/integration.runsettings \
            --no-build \
            --configuration Release \
            --logger "console;verbosity=minimal" \
            --blame-hang-timeout 5min \
            2>&1 | tee "integration-${{ matrix.shard.name }}.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "dotnet_test_rc=${rc}" >> "$GITHUB_OUTPUT"
          echo "dotnet test e' uscito con ${rc}. L'esito del job lo decide il passo di guardia."

      # #3632/#3742/#4298 — il verde va misurato, non dichiarato; il troncamento va NOMINATO; e il
      # colore del job lo decide QUESTO passo.
      #
      # Il job e' verde quando tutte queste cose sono vere, e rosso se ne manca una:
      #   - i test sono partiti e hanno lasciato log e .trx, con almeno cento eseguiti;
      #   - la sessione NON e' stata troncata dal TestSessionTimeout (una selezione misurata a meta'
      #     non e' verde: e' non misurata);
      #   - falliti e saltati sono quelli dichiarati nella baseline, PER NOME — un conteggio uguale
      #     con un test diverso dentro e' una regressione;
      #   - il codice d'uscita di `dotnet test` e' coerente col .trx.
      # Quindi «rosso» vuol dire «e' cambiato qualcosa, oppure non ho potuto misurare», e non piu'
      # «c'e' almeno un fallimento, come sempre».
      #
      # `!cancelled()` e non `always()`: su una cancellazione non c'è niente da misurare.
      - name: 'Gate: misurato per intero ed entro la baseline (#3742, #4298)'
        if: ${{ !cancelled() }}
        working-directory: apps/api
        env:
          SHARD: ${{ matrix.shard.name }}
          DOTNET_TEST_RC: ${{ steps.tests.outputs.dotnet_test_rc }}
        run: |
          set -uo pipefail
          status=0
          log="integration-${SHARD}.log"

          if [ ! -f "$log" ]; then
            echo "::error::Shard ${SHARD}: log assente, lo step dei test non e partito."
            exit 1
          fi

          mapfile -t trx_files < <(find . -name 'integration-test-results.trx' -print)
          if [ ${#trx_files[@]} -eq 0 ]; then
            echo "::error::Shard ${SHARD}: nessun .trx, nessun test eseguito."
            status=1
          fi

          executed=0
          for f in "${trx_files[@]}"; do
            n=$(sed -n 's/.*<Counters[^>]* executed="\([0-9]\{1,\}\)".*/\1/p' "$f" | head -1)
            if ! [[ "${n:-}" =~ ^[0-9]+$ ]]; then
              echo "::error::$f: counter 'executed' illeggibile (trx malformato?)."
              status=1
              continue
            fi
            echo "  $f -> executed=$n"
            executed=$((executed + n))
          done

          # Soglia bassa e deliberata: distingue «e girato» da «zero», non pinna un numero.
          if [ "$executed" -lt 100 ]; then
            echo "::error::Shard ${SHARD}: solo $executed test eseguiti, sarebbe stato verde senza eseguire nulla (#3632)."
            status=1
          fi

          # `|| true`: sotto `set -e` + `pipefail`, un grep senza match esce 1 e l'assegnazione
          # ucciderebbe lo script prima di scrivere il summary e prima del controllo sul
          # troncamento. Il fallback `${summary:-...}` qui sotto sarebbe altrimenti irraggiungibile:
          # serve per i log senza trailer Passed!/Failed! (test host crashato, dotnet test mai
          # partito, dump di --blame-hang), non per il troncamento — una run troncata stampa
          # comunque il trailer dopo `Test Run Aborted.`.
          summary=$(grep -aE '^(Passed|Failed)!  -' "$log" | tail -1 || true)
          {
            echo "### Backend Integration — ${SHARD}"
            echo
            echo '```'
            echo "${summary:-(riepilogo non trovato nel log)}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # #4024 — il confronto con la baseline, che prima NON esisteva.
          #
          # Qui c'era una riga di prosa: «Baseline attesa per shard: Core 9 · KnowledgeBase 4 ·
          # Games 3 (#3633)». Non veniva confrontata con nulla, e i suoi numeri erano GIA' FALSI:
          # i fallimenti misurati sul run 36997819474 sono 4 · 23 · 2. Un totale in prosa dentro un
          # workflow invecchia come qualunque altro, e stampare non è misurare.
          #
          # Lo script confronta fallimenti E salti con infra/fixtures/dev-async-shard-baseline.json.
          # Conta i salti dagli elementi `<UnitTestResult outcome="NotExecuted">` e non da
          # `Counters/@notExecuted`, che vale 0 su tutti e tre gli shard anche con 45 salti — un gate
          # scritto col campo ovvio leggerebbe sempre zero. La sua suite bats gira nel job
          # *Infra Scripts* di dev-fast, dove la prova costa secondi invece dei ~90 minuti di qui.
          #
          # #4036 — da sola segnalazione a ERRORE. Due difetti correggevano il «basta togliere il
          # `|| true`» con cui questo blocco era arrivato:
          #
          # 1. 🔴 Lo script era in PIPE verso `tee`, e il default di GitHub Actions è `bash -e {0}`:
          #    senza `pipefail` lo stato della pipeline è quello di `tee`, cioè 0. Rimosso il
          #    `|| true`, il gate sarebbe rimasto verde su qualunque esito — il gate verde e vuoto,
          #    dentro il lavoro che dovrebbe chiuderne la famiglia. Lo stato va catturato, non
          #    dedotto dalla pipeline.
          # 2. Il comparatore e il guardiano della troncatura qui sotto segnalavano la STESSA cosa.
          #    Ora ciascun segnale ha un solo proprietario: exit 1 = regressione dei salti o dei
          #    fallimenti (blocca, ed è questo blocco); exit 2 = non misurabile perché la run è
          #    troncata (segnalato qui, e il job lo fa fallire il guardiano sotto, che è di #3742).
          # 🔴 Percorso ASSOLUTO, e non è pedanteria: questo step ha `working-directory: apps/api`,
          # quindi `bash infra/scripts/…` cercava `apps/api/infra/scripts/…` e usciva
          # «No such file or directory». Con il `|| true` della prima versione quell'errore era
          # INGHIOTTITO: il comparatore introdotto in #4030 non ha girato NEMMENO UNA VOLTA, e il
          # summary mostrava un blocco vuoto che si leggeva come «nessuna anomalia». Scoperto nel
          # run 37111650114 leggendo il log invece del colore del job.
          comparator="${GITHUB_WORKSPACE}/infra/scripts/shard-skip-assert.sh"
          if [ ! -f "$comparator" ]; then
            echo "::error::comparatore non trovato in $comparator — il percorso e' sbagliato, non e' un problema dei conteggi"
            status=1
          else
            set +e
            bash "$comparator" \
              --shard "${SHARD}" \
              --trx "${trx_files[0]}" \
              --log "$log" > /tmp/shard-assert.out 2>&1
            assert_rc=$?
            set -e
            cat /tmp/shard-assert.out

            case "$assert_rc" in
              0) assert_label="entro la baseline ✓" ;;
              2) assert_label="⚠️ NON MISURABILE — run troncata, confronto non eseguito (#3742)" ;;
              *) assert_label="❌ FUORI dalla baseline" ; status=1 ;;
            esac

            {
              echo
              echo "<details><summary>Confronto con la baseline, per nome (#4024, #4298): ${assert_label}</summary>"
              echo
              echo '```'
              cat /tmp/shard-assert.out
              echo '```'
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          truncated=false
          if grep -qa 'Aborting test run: test run timeout' "$log"; then
            echo "::error::Shard ${SHARD} TRONCATO: il TestSessionTimeout e scattato. La selezione NON e stata misurata per intero: i conteggi qui sopra sono parziali e non confrontabili con la baseline dei fallimenti (#3633). Il guard e' di #3742."
            {
              echo
              echo "> ⚠️ **Shard troncato** — sessione abortita sul TestSessionTimeout. Conteggi parziali."
            } >> "$GITHUB_STEP_SUMMARY"
            status=1
            truncated=true
          fi

          # #3742 — quanta parte del TestSessionTimeout ha usato la sessione. La troncatura non
          # arriva all'improvviso: lo shard Games e' stato per settimane a pochi minuti dal limite,
          # verde sui runner veloci, e nessun numero lo diceva finche' un runner lento non lo ha
          # superato. Lo script riporta la quota a ogni run e avvisa oltre l'80%; non decide il
          # colore del job, che resta al confronto con la baseline e alla guardia qui sopra.
          #
          # Lo script assente e' un errore e non un avviso, per la stessa ragione del comparatore:
          # un percorso sbagliato qui produrrebbe un riepilogo senza la riga, che si legge come
          # «tutto a posto». Un .trx da cui la durata non si ricava e' invece solo un avviso: il
          # margine non e' misurabile, ma la selezione lo e' stata.
          budget="${GITHUB_WORKSPACE}/infra/scripts/shard-session-budget.sh"
          if [ ! -f "$budget" ]; then
            echo "::error::script del margine non trovato in $budget — il percorso e' sbagliato, non e' un problema dei tempi"
            status=1
          elif [ ${#trx_files[@]} -gt 0 ]; then
            set +e
            bash "$budget" \
              --shard "${SHARD}" \
              --trx "${trx_files[0]}" \
              --runsettings "${GITHUB_WORKSPACE}/apps/api/tests/Api.Tests/integration.runsettings" > /tmp/shard-budget.out 2>&1
            budget_rc=$?
            set -e
            cat /tmp/shard-budget.out
            if [ "$budget_rc" -ne 0 ]; then
              echo "::warning::Shard ${SHARD}: il margine sul TestSessionTimeout non e' calcolabile (vedi la riga sopra)."
            fi
            {
              echo
              if [ "$budget_rc" -eq 0 ]; then
                echo "**Margine (#3742):** $(grep -v '^::' /tmp/shard-budget.out | head -1)"
              else
                echo "**Margine (#3742):** non calcolabile."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # #4298 — il codice d'uscita di `dotnet test`. Da quando il passo dei test non fa piu'
          # fallire il job da solo, questo controllo impedisce di far passare per verde cio' che il
          # .trx non racconta: un host dei test crashato, un'uscita anomala, un passo che non ha
          # lasciato il codice. I test FALLITI non c'entrano: quelli li ha gia' giudicati, per
          # nome, il confronto con la baseline qui sopra.
          rc="${DOTNET_TEST_RC:-}"
          trx_failed=""
          if [ ${#trx_files[@]} -gt 0 ]; then
            trx_failed=$(sed -n 's/.*<Counters[^>]* failed="\([0-9]\{1,\}\)".*/\1/p' "${trx_files[0]}" | head -1)
          fi
          if ! [[ "$rc" =~ ^[0-9]+$ ]]; then
            echo "::error::Shard ${SHARD}: il passo dei test non ha lasciato un codice d'uscita (\"${rc}\"). Senza, non si sa se dotnet test e' arrivato in fondo."
            status=1
          elif [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::Shard ${SHARD}: dotnet test e' uscito con ${rc}, che non e' ne' «tutto verde» (0) ne' «alcuni test falliti» (1): host dei test crashato, sessione abortita o altro. Va letto il log."
            status=1
          elif [ "$rc" -eq 1 ] && [ "${trx_failed}" = "0" ] && [ "$truncated" = false ]; then
            # `truncated`: su una sessione abortita dal TestSessionTimeout `dotnet test` esce 1
            # senza test falliti, ed e' la troncatura stessa — gia' segnalata qui sopra, e gia'
            # rossa. Ripeterla come «qualcosa e' fallito fuori dai test» manda chi legge a cercare
            # una fixture rotta che non c'e' (run 38425039410, shard Games).
            echo "::error::Shard ${SHARD}: dotnet test e' uscito con 1 ma il .trx non ha test falliti. Qualcosa e' fallito FUORI dai test (discovery, fixture, logger) e il confronto con la baseline non lo vede."
            status=1
          elif [ "$rc" -eq 0 ] && [ -n "${trx_failed}" ] && [ "${trx_failed}" != "0" ]; then
            echo "::error::Shard ${SHARD}: dotnet test e' uscito con 0 ma il .trx ha ${trx_failed} falliti. Le due fonti si contraddicono."
            status=1
          fi

          {
            echo
            if [ "$status" -eq 0 ]; then
              echo "**Esito del gate: ✅ verde** — selezione misurata per intero, falliti e saltati sono quelli dichiarati."
            else
              echo "**Esito del gate: ❌ rosso** — qualcosa e' cambiato rispetto alla baseline, oppure la misura non e' completa. Gli errori sono qui sopra."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit $status

      # Le durate per-test del .trx sono l'unico modo di attribuire un guadagno o una regressione a
      # una causa. Il runsettings il .trx lo produce già (integration-test-results.trx): finora
      # nessuno lo raccoglieva, quindi ogni ipotesi sulle prestazioni della suite restava tale.
      - name: Upload test results
        # `always()` e non `!cancelled()`: un job che sfora `timeout-minutes` risulta `cancelled`,
        # e quella e' proprio la run le cui durate interessano di piu' — quella che ha esaurito il
        # tempo. Con `!cancelled()` l'artifact spariva li'. Il guard sopra tiene `!cancelled()`:
        # su una cancellazione da concurrency non c'e' davvero niente da misurare.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results-${{ matrix.shard.name }}
          path: |
            apps/api/**/integration-test-results.trx
            apps/api/integration-*.log
          retention-days: 14
          if-no-files-found: warn
