# promtool unit tests for domain-event-outbox-batch.yml (#5030).
#
# Run locally (Git Bash, from repo root):
#   docker run --rm -v "$(pwd)/infra/prometheus/alerts:/work" -w /work --entrypoint promtool \
#     prom/prometheus:v3.7.0 test rules domain-event-outbox-batch.test.yml
#
# CI: .github/workflows/prometheus-rules-gate.yml runs every *.test.yml under infra/prometheus.
rule_files:
  - domain-event-outbox-batch.yml

evaluation_interval: 1m

tests:
  # Stuck outbox: the batch fails on every poll (12 per minute at a 5 s poll) -> fires.
  - interval: 1m
    input_series:
      - series: 'meepleai_domain_event_outbox_batch_failed_total_batches_total{exception_type="DbUpdateException"}'
        values: '0+12x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: DomainEventOutboxBatchFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
              component: domain_event_outbox
            exp_annotations:
              summary: "Domain event outbox batches are failing as a whole (#5030)"
              description: "At least 3 domain_event_outbox batches failed as a whole in the last 10 minutes, for 5 minutes. A failed batch rolls back: none of its rows advances and the next poll takes the same rows again, so domain events are not being delivered. Read the exception_type label and the 'DomainEventOutboxProcessor batch failed' log lines."
              runbook_url: "https://github.com/meepleAi-app/meepleai-monorepo/blob/main-dev/docs/for-developers/operations/operations-manual.md#domain-event-outbox-alerts"

  # A blip: two failed batches, then none -> no alert (guards the threshold).
  - interval: 1m
    input_series:
      - series: 'meepleai_domain_event_outbox_batch_failed_total_batches_total{exception_type="NpgsqlException"}'
        values: '0 1 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2'
    alert_rule_test:
      - eval_time: 10m
        alertname: DomainEventOutboxBatchFailing
        exp_alerts: []
      - eval_time: 25m
        alertname: DomainEventOutboxBatchFailing
        exp_alerts: []

  # Failures spread over two exception types add up: the rule sums the label away -> fires.
  - interval: 1m
    input_series:
      - series: 'meepleai_domain_event_outbox_batch_failed_total_batches_total{exception_type="DbUpdateException"}'
        values: '0+1x30'
      - series: 'meepleai_domain_event_outbox_batch_failed_total_batches_total{exception_type="NpgsqlException"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: DomainEventOutboxBatchFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
              component: domain_event_outbox
            exp_annotations:
              summary: "Domain event outbox batches are failing as a whole (#5030)"
              description: "At least 3 domain_event_outbox batches failed as a whole in the last 10 minutes, for 5 minutes. A failed batch rolls back: none of its rows advances and the next poll takes the same rows again, so domain events are not being delivered. Read the exception_type label and the 'DomainEventOutboxProcessor batch failed' log lines."
              runbook_url: "https://github.com/meepleAi-app/meepleai-monorepo/blob/main-dev/docs/for-developers/operations/operations-manual.md#domain-event-outbox-alerts"

  # Healthy outbox: the counter never moves -> no alert.
  - interval: 1m
    input_series:
      - series: 'meepleai_domain_event_outbox_batch_failed_total_batches_total{exception_type="DbUpdateException"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: DomainEventOutboxBatchFailing
        exp_alerts: []
