# OPS-02: Prometheus Configuration for MeepleAI — DEVELOPMENT
# Scrapes metrics from the API service for observability
#
# ⚠️  ENVIRONMENT-SPECIFIC FILES:
#   staging → prometheus.staging.yml (cluster: meepleai-staging)
#   prod    → prometheus.prod.yml    (cluster: meepleai-prod)
# This file is mounted only by compose.dev.yml (default fallback).

global:
  scrape_interval: 15s       # Default scrape interval
  evaluation_interval: 15s   # How often to evaluate rules
  scrape_timeout: 10s        # Timeout for each scrape

  external_labels:
    cluster: 'meepleai-dev'
    environment: 'development'

# OPS-05: Alertmanager configuration for error monitoring
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      timeout: 10s
      api_version: v2

# OPS-05: Rule files for recording and alerting rules
rule_files:
  - '/etc/prometheus/prometheus-rules.yml'
  # Issue #2470 — Wikidata SSE plane starvation alerts.
  - '/etc/prometheus/wikidata-sse.yml'
  # Issue #3117 — Wikidata enrichment pipeline-health alerts (dead-letter / queue depth).
  - '/etc/prometheus/wikidata-enrichment.yml'
  # Issue #3082 — BGG ToS-compliance SLO=0 alert (any nonzero render attempt = P1).
  - '/etc/prometheus/bgg-tos-compliance.yml'
  # #3495 M2 — SSRF egress guard (manual-cover private_ip/denylist_hit SLO=0).
  - '/etc/prometheus/egress-guard.yml'
  # Issue #3112 — OPS-02 Slack delivery observability alerts.
  - '/etc/prometheus/slack-delivery.yml'
  # Issue #3116 — SP5 Admin Security audit_outbox health alerts.
  - '/etc/prometheus/audit-outbox.yml'
  # Issue #1965 — domain_event_outbox duplicate-publish trigger (dormant until API >=2 replicas).
  - '/etc/prometheus/domain-event-outbox-duplicate-publish.yml'
  # Issue #3248 (epic #448 C5) — copyright enforcement observability alerts.
  - '/etc/prometheus/copyright-enforcement.yml'
  # Issue #3390 (epic #3397) Slice 1 — in-session agent grounding observability (ungrounded-rate on RAG live path).
  - '/etc/prometheus/agent-grounding.yml'

# Scrape configurations
scrape_configs:
  # Scrape Prometheus itself for monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Scrape MeepleAI API metrics (OpenTelemetry Prometheus exporter)
  - job_name: 'meepleai-api'
    scrape_interval: 10s  # More frequent scraping for API metrics
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8080']
        labels:
          service: 'meepleai-api'
          component: 'backend'

  # Issue #3797: Scrape Next.js middleware session cache metrics
  - job_name: 'meepleai-web'
    scrape_interval: 15s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['web:3000']
        labels:
          service: 'meepleai-web'
          component: 'frontend'

  # Scrape Grafana metrics (optional)
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'
          component: 'visualization'

  # ---------------------------------------------------------------------------
  # AI/ML Services (profile: ai)
  # These services are only available when started with --profile ai or --profile full.
  # Expect "target is down" alerts in minimal/dev profiles — this is expected behavior.
  # To suppress false alerts, use relabeling or inhibition rules in alertmanager.yml.
  # ---------------------------------------------------------------------------

  # Embedding service (local multilingual embeddings) [profile: ai]
  - job_name: 'embedding-service'
    scrape_interval: 15s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['embedding-service:8000']
        labels:
          service: 'embedding-service'
          component: 'ml'
          profile: 'ai'

  # Unstructured PDF extraction service (stage 1) [profile: ai]
  - job_name: 'unstructured-service'
    scrape_interval: 15s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['unstructured-service:8001']
        labels:
          service: 'unstructured-service'
          component: 'ingestion'
          profile: 'ai'

  # SmolDocling VLM extraction service (stage 2) [profile: ai]
  - job_name: 'smoldocling-service'
    scrape_interval: 15s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['smoldocling-service:8002']
        labels:
          service: 'smoldocling-service'
          component: 'ingestion'
          profile: 'ai'

  # OPS-05: Scrape Alertmanager metrics
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          service: 'alertmanager'
          component: 'alerting'

  # P3-705: cAdvisor - Container metrics
  - job_name: 'cadvisor'
    scrape_interval: 30s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
          component: 'container-metrics'

  # P3-705: node-exporter - Host metrics
  - job_name: 'node-exporter'
    scrape_interval: 30s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          component: 'host-metrics'
