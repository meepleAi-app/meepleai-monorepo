name: Backend E2E Tests

# RUNNER — #3662: questi job girano su `ubuntu-latest` FISSO, deliberatamente, e non
# sull'indirezione `${{ vars.RUNNER && fromJSON(vars.RUNNER) || 'ubuntu-latest' }}` usata
# altrove nel repo.
#
# `vars.RUNNER` puntava al runner self-hosted CO-LOCATO sul VPS di staging
# (`self-hosted,linux,ARM64`), dove questo build competeva per la RAM con i servizi in
# esecuzione. Il 2026-06-22 lo step *Build Solution* è morto con
# `System.OutOfMemoryException` dentro l'analyzer Roslyn, e quel run è rimasto l'ULTIMO
# per sette settimane. #3331 ha poi ritirato quel runner («co-located CI runner is the
# structural disk/RAM driver»), e da allora il build passa in ~6 min su GitHub-hosted.
#
# Il README documenta però una «Rollback Procedure» per re-introdurre il self-hosted
# ricreando la variabile `RUNNER`. Se qualcuno la esegue per i workflow di DEPLOY --
# che quel runner ce l'hanno per un motivo, ci deployano sopra -- un workflow di TEST
# come questo lo seguirebbe silenziosamente e l'OOM tornerebbe identico.
# Un gate di test non ha ragione di girare sul runner di deploy: qui il legame è tagliato.

on:
  pull_request:
    # Scope to prod-promotion only (main-staging → main). Real-API E2E checks
    # produce noise on dev releases (main-dev → main-staging). See companion
    # change in api-smoke.yml + #979 release-PR triage.
    branches: [main]
    paths:
      - 'apps/api/**'
      # #3662: era `tests/Api.Tests/E2E/**`, che NON esiste -- i test E2E stanno sotto
      # `apps/api/tests/`. Innocuo solo perché `apps/api/**` copre già tutto, ma un
      # filtro che non corrisponde a nulla è indistinguibile da uno che funziona.
      - 'apps/api/tests/Api.Tests/E2E/**'
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: backend-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Minimal required permissions
permissions:
  contents: read
  pull-requests: write
  checks: write

  actions: read
jobs:
  # Quick path filtering
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest  # NON usare vars.RUNNER qui -- vedi commento in testa al file (#3662)
    outputs:
      e2e-needed: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            e2e:
              - 'apps/api/**'
              - 'apps/api/tests/Api.Tests/E2E/**'  # #3662: era `tests/…`, path inesistente
              - '.github/workflows/backend-e2e-tests.yml'

  # Backend E2E Tests with Testcontainers
  backend-e2e-tests:
    name: Backend E2E Tests
    runs-on: ubuntu-latest  # NON usare vars.RUNNER qui -- vedi commento in testa al file (#3662)
    needs: changes
    if: needs.changes.outputs.e2e-needed == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        # Issue #850 AC-3: tight key fingerprint includes Directory.Packages.props
        # and global.json so SDK/centralized-package changes also invalidate.
        # AC-7: `vars.CACHE_VERSION` is the global emergency-invalidation knob:
        # `gh variable set CACHE_VERSION --body v2` flushes all caches at once.
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ vars.CACHE_VERSION || 'v1' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: |
            nuget-${{ vars.CACHE_VERSION || 'v1' }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore Dependencies
        working-directory: apps/api
        run: dotnet restore

      - name: Build Solution
        working-directory: apps/api
        run: dotnet build --no-restore --configuration Release

      - name: Run E2E Tests
        working-directory: apps/api
        run: |
          dotnet test tests/Api.Tests/Api.Tests.csproj \
            --no-build \
            --configuration Release \
            --filter "Category=E2E" \
            --logger "trx;LogFileName=e2e-test-results.trx" \
            --logger "console;verbosity=detailed" \
            --results-directory ./TestResults \
            -- RunConfiguration.TestSessionTimeout=600000
        env:
          CI: true
          DOTNET_ENVIRONMENT: Testing

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-e2e-test-results
          path: apps/api/TestResults/
          retention-days: 7

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040  # v2
        with:
          files: apps/api/TestResults/**/*.trx
          check_name: Backend E2E Test Results
          comment_mode: off

  # Quality Gate
  backend-e2e-quality-gate:
    name: Backend E2E Quality Gate
    runs-on: ubuntu-latest  # NON usare vars.RUNNER qui -- vedi commento in testa al file (#3662)
    needs: backend-e2e-tests
    if: always()
    steps:
      - name: Check Test Results
        run: |
          if [ "${{ needs.backend-e2e-tests.result }}" == "success" ]; then
            echo "✅ Backend E2E tests passed"
          else
            echo "❌ Backend E2E tests failed"
            exit 1
          fi

      - name: Comment PR with Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v8
        with:
          script: |
            const status = '${{ needs.backend-e2e-tests.result }}';
            const emoji = status === 'success' ? '✅' : '❌';
            const statusText = status === 'success' ? 'PASSED' : 'FAILED';

            const body = `## ${emoji} Backend E2E Test Results: ${statusText}

            **Status**: ${statusText}

            **Test Categories**:
            - Authentication Flow
            - Game Management
            - Share Request Workflow
            - User Library Management
            - Notification Management
            - Document Processing
            - Chat/AI Flows

            **Artifacts**:
            - Test results (.trx) available in workflow artifacts

            Issue #3012: Backend E2E Test Suite`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  notify-end:
    if: always() && contains(join(needs.*.result, ','), 'failure')
    needs: [changes, backend-e2e-tests, backend-e2e-quality-gate]
    uses: ./.github/workflows/notify-slack.yml
    with:
      event: failed
      workflow_name: "Backend E2E Tests"
      environment: test
      branch: ${{ github.head_ref || github.ref_name }}
      actor: ${{ github.actor }}
      commit_sha: ${{ github.sha }}
      commit_message: ${{ github.event.head_commit.message || 'Manual trigger' }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      SLACK_GITNOTIFY_WEBHOOK_URL: ${{ secrets.SLACK_GITNOTIFY_WEBHOOK_URL }}
